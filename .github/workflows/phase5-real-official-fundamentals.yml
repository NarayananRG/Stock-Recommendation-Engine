name: Phase 5 Real Official Fundamental Bundle

on:
  push:
    branches: [ui-0.11.0-phase5-fundamental-v3]
    paths:
      - ".github/workflows/phase5-real-official-fundamentals.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sre-phase5-real-fundamentals
  cancel-in-progress: false

jobs:
  build-real-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Phase 2A.1 official NSE filing metadata
        run: |
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a1_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a1_pilot.py"
          python "NextGen Research/scripts/validate_fundamental_v2_phase2a1_pilot.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a1_scaled.py"

      - name: Phase 2A.3 full official XBRL canonical mapping
        run: |
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a2_tests.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a3_scaled_mapping_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a3_scaled_mapping_validation.py"

      - name: Diagnose official archive gaps and close mapping gate
        run: |
          python "NextGen Research/scripts/diagnose_fundamental_v2_phase2a3_ixbrl_structure.py"
          python "NextGen Research/scripts/close_fundamental_v2_phase2a3.ps1.py"

      - name: Build canonical PIT feature panel
        run: |
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a4_feature_panel_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a4_feature_panel.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a4_continuity_review_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a4_continuity_review.py"

      - name: Build PIT derived events
        run: |
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a5_event_feature_eligibility_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a5_event_feature_eligibility.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a5_derived_event_transform_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a5_derived_event_transforms.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a5_distribution_review_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a5_distribution_review.py"

      - name: Build semantic and filing risk profiles
        run: |
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a6_semantic_interpretation_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a6_semantic_interpretation.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a7_risk_event_builder_tests.py"
          python "NextGen Research/scripts/run_fundamental_v2_phase2a7_risk_event_builder.py"

      - name: Validate Phase 5 real bundle contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json

          root=Path("NextGen Research/results")
          panel=root/"fundamental_v2_phase2a4_feature_panel"/"canonical_feature_panel.csv"
          events=root/"fundamental_v2_phase2a5_derived_event_transforms"/"derived_events.jsonl"
          risks=root/"fundamental_v2_phase2a7_risk_events"/"risk_event_profiles.jsonl"
          closure=root/"fundamental_v2_phase2a3_scaled_mapping_validation"/"phase2a3_closure_v1.json"

          assert panel.exists() and events.exists() and risks.exists() and closure.exists()
          rows=list(csv.DictReader(panel.open(encoding="utf-8")))
          assert len(rows)==2181, len(rows)
          event_count=sum(1 for line in events.open(encoding="utf-8") if line.strip())
          assert event_count==17253, event_count
          risk_count=sum(1 for line in risks.open(encoding="utf-8") if line.strip())
          assert risk_count>0, risk_count
          c=json.loads(closure.read_text(encoding="utf-8"))
          assert c["status"]=="PASS_WITH_QUANTIFIED_OFFICIAL_ARCHIVE_GAPS", c
          assert c["semantic_hard_failure_count"]==0, c
          print(json.dumps({
            "panel_rows":len(rows),
            "derived_events":event_count,
            "risk_profiles":risk_count,
            "parsed_document_coverage":c["parsed_document_coverage"],
            "authority":"SHADOW_ONLY",
            "yfinance_used":False
          },indent=2))
          PY

      - name: Build compact desktop fundamental bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, zipfile

          src=Path("NextGen Research/results")
          stage=Path("phase5_real_bundle/NextGen Research/results")
          wanted=[
            ("fundamental_v2_phase2a1_scaled/all_target_events.json",),
            ("fundamental_v2_phase2a1_scaled/scaled_pit_validation.json",),
            ("fundamental_v2_phase2a3_scaled_mapping_validation/phase2a3_closure_v1.json",),
            ("fundamental_v2_phase2a4_feature_panel/canonical_feature_panel.csv",),
            ("fundamental_v2_phase2a4_feature_panel/summary.json",),
            ("fundamental_v2_phase2a5_derived_event_transforms/derived_events.jsonl",),
            ("fundamental_v2_phase2a5_derived_event_transforms/summary.json",),
            ("fundamental_v2_phase2a6_semantic_interpretation/summary.json",),
            ("fundamental_v2_phase2a7_risk_events/risk_event_profiles.jsonl",),
            ("fundamental_v2_phase2a7_risk_events/summary.json",),
          ]
          for (rel,) in wanted:
            source=src/rel
            assert source.exists(), rel
            dest=stage/rel
            dest.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(source,dest)

          manifest={
            "artifact_type":"SRE_PHASE5_REAL_FUNDAMENTAL_BUNDLE_V1",
            "authority":"SHADOW_ONLY",
            "source":"OFFICIAL_NSE_INTEGRATED_FILING_XBRL",
            "yfinance_used":False,
            "synthetic_data_in_release_bundle":False,
            "target_quarters":["2025-03-31","2025-06-30","2025-09-30","2025-12-31","2026-03-31","2026-06-30"],
          }
          m=stage.parent/"phase5_real_fundamental_manifest.json"
          m.write_text(json.dumps(manifest,indent=2),encoding="utf-8")

          out=Path("SRE_Phase5_Real_Official_Fundamentals.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in Path("phase5_real_bundle").rglob("*"):
              if p.is_file():
                z.write(p,p.relative_to("phase5_real_bundle"))
          print(out, out.stat().st_size)
          PY

      - name: Upload real official fundamental bundle
        uses: actions/upload-artifact@v4
        with:
          name: SRE-Phase5-Real-Official-Fundamentals
          path: SRE_Phase5_Real_Official_Fundamentals.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SRE-Phase5-Fundamental-Pipeline-Diagnostics
          path: |
            NextGen Research/results/fundamental_v2_phase2a1_pilot/**
            NextGen Research/results/fundamental_v2_phase2a1_scaled/**
            NextGen Research/results/fundamental_v2_phase2a3_scaled_mapping_validation/summary.json
            NextGen Research/results/fundamental_v2_phase2a3_scaled_mapping_validation/retrieval_failures.json
            NextGen Research/results/fundamental_v2_phase2a3_ixbrl_diagnostic/**
          if-no-files-found: ignore
          retention-days: 7

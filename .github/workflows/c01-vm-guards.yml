name: C01 VM adaptation guards
on:
  push:
    branches: [review/c01-vm-staging-20261024]
    paths: [tools/c01-vm/**, .github/workflows/c01-vm-guards.yml]
  workflow_dispatch:
jobs:
  guards:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.10', '3.14.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original staging guards plus VM identity isolation and resume guards
        working-directory: tools/c01-vm
        run: python -B run_guard_tests.py
      - name: Parse host export and VM-only PowerShell entry points
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          foreach($f in (Get-ChildItem tools/c01-vm/package/*.ps1)) {
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){throw ($errors | Out-String)}
          }

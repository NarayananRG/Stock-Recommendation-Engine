name: Gate A closure correction acceptance
on:
  push:
    branches: [fix/gatea-holdings-registry-20261022]
    paths: [.github/workflows/gatea-closure.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .ci/gatea-closure
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Restore code-only fixtures
        shell: python
        run: |
          import base64,hashlib,zipfile,io,pathlib
          b=base64.b64decode(pathlib.Path('.ci/gatea-closure/source.b64').read_text())
          assert hashlib.sha256(b).hexdigest()=='8d12ca6d8bc1a5a92915a0eaae404df24b70d318a349b267179f4b3e81170466'
          zipfile.ZipFile(io.BytesIO(b)).extractall('.')
      - name: Install isolated CI dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas polars==2.0.0 pyarrow==26.0.0 fastapi pytest httpx uvicorn
      - name: Test holdings lifecycle, missing data, PIT, idempotency and frozen rule parity
        env:
          PYTHONPATH: gatea-fixed
        run: python -m pytest gatea-tests/test_holdings.py gatea-closure/test_closure.py gatea-closure/test_legacy_corrected_fixture.py gatea-closure/test_current_contract.py gatea-closure/test_legacy_replacement_current_fixture.py gatea-tests/test_v10_core.py gatea-fixed/tests -k "not actual and not frozen_contract" -q --junitxml=native-results.xml
      - name: Test guarded Windows apply and exact rollback on safe synthetic installation
        env:
          PYTHONPATH: gatea-fixed
          PY_PYTHON3: ${{ matrix.python }}
        run: python gatea-tests/install-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatea-closure-windows-${{ matrix.python }}
          path: native-results.xml

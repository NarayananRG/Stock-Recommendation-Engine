name: Build 0.8.5 Ultra UI Source ZIP

on:
  push:
    branches:
      - ui-0.8.5-ultra-redesign
    paths:
      - ".github/workflows/fundamental-v2-phase2a1-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4

      - name: Reconstruct exact canonical source ZIP
        shell: bash
        run: |
          set -euo pipefail
          dir="stock-engine-ultra-ui-0.8.5-source-with-windows-builder"
          cat "$dir"/source.part.*.b64 | base64 --decode > StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE.zip
          echo "915425e7027fd6145298e3e467b678e6f5998a895d85c4c18a9cfec033df7edc  StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE.zip" | sha256sum --check
          unzip -t StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE.zip

      - name: Upload exact source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: stock-recommendation-engine-0.8.5-ultra-ui-source
          path: StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

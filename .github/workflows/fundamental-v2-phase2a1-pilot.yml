name: Fundamental V2 Phase 2A.1 Pilot

on:
  push:
    branches:
      - fundamental-research-v2-phase2a-pit-recovery
    paths:
      - ".github/workflows/fundamental-v2-phase2a1-pilot.yml"
      - "NextGen Research/fundamental_research_v2_phase2a/**"
      - "NextGen Research/scripts/run_fundamental_v2_phase2a1_pilot.py"
      - "NextGen Research/tests/run_fundamental_research_v2_phase2a1_tests.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded runtime dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Run Phase 2A.1 contract tests
        run: python "NextGen Research/tests/run_fundamental_research_v2_phase2a1_tests.py"

      - name: Run official NSE four-symbol PIT pilot
        id: pilot
        run: |
          set +e
          python "NextGen Research/scripts/run_fundamental_v2_phase2a1_pilot.py"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-v2-phase2a1-pilot
          path: "NextGen Research/results/fundamental_v2_phase2a1_pilot"
          if-no-files-found: warn
          retention-days: 14

name: V2 debt gap triage and recovery regression
on:
  push:
    branches: [debt-gap-triage-v2-bundle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test debt gap classification and existing readiness
        run: |
          python .ci/recommendation_audit/test_triage_debt_equity_v2.py -v
          python .ci/recommendation_audit/test_sector_evidence_readiness.py -v
          python .ci/recommendation_audit/test_actual_snapshot_compare_v2.py -v
      - name: Install financial test dependencies
        run: python -m pip install numpy pandas requests
      - name: Test V2 official recovery and decision invariants
        run: |
          python "NextGen Research/tests/run_complete_financial_coverage_v2_tests.py"
          python "NextGen Research/tests/run_current_universe_recovery_tests.py"
          python .ci/native140/test_live_decision_v1.py

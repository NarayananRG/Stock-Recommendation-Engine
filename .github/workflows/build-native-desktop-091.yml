name: Build SRE 0.9.1 Native Desktop

on:
  push:
    branches: [ui-0.9.1-native-desktop]
    paths:
      - ".ci/native091/**"
      - ".github/workflows/build-native-desktop-091.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sre-native-091
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Decode verified native desktop source
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".ci\native091\source.part.*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 native source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if ($b64.Length -ne 39284) { throw "Native source base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\native-desktop-0.9.1-source.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "86dd430e933d044d08ae4637787eff52369b46b7ee1013e48af7851d9ea88fcc") { throw "Native source ZIP hash mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath "." -Force
          Copy-Item ".ci\native091\main_system_python.rs" "native-desktop-0.9.1\src-tauri\src\main.rs" -Force
          Copy-Item ".ci\native091\Cargo.toml" "native-desktop-0.9.1\src-tauri\Cargo.toml" -Force
          if (!(Test-Path "native-desktop-0.9.1\src-tauri\Cargo.toml")) { throw "Native source decode failed" }

      - name: Reconstruct canonical 0.8.5 engine source
        shell: pwsh
        run: |
          $dir = "stock-engine-ultra-ui-0.8.5-source-with-windows-builder"
          $parts = Get-ChildItem -Path $dir -Filter "source.part.*.b64" | Sort-Object Name
          if (!$parts) { throw "0.8.5 canonical source parts missing" }
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = "$env:RUNNER_TEMP\sre085.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "915425e7027fd6145298e3e467b678e6f5998a895d85c4c18a9cfec033df7edc") { throw "Canonical source hash mismatch: $hash" }
          $extract = "$env:RUNNER_TEMP\engine-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $engine = Join-Path $extract "StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE"
          if (!(Test-Path "$engine\requirements-v1.txt")) { throw "Canonical engine root missing" }
          Copy-Item "native-desktop-0.9.1\engine-overlay\*" $engine -Recurse -Force
          if (!(Test-Path "$engine\run_modern_ui.py")) { throw "Engine overlay failed" }
          "SRE_ENGINE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test source backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          $engine = "$env:SRE_ENGINE_ROOT"
          $data = "$env:RUNNER_TEMP\sre-appdata"
          $env:STOCK_MODERN_UI_PREVIEW = "1"
          $p = Start-Process -FilePath python -ArgumentList "`"$engine\run_modern_ui.py`" --no-browser --host 127.0.0.1 --port 18765 --repo-root `"$engine`" --app-data-dir `"$data`"" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "Source backend exited early with code $($p.ExitCode)" }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "Source backend health check timed out" }
            $stock = Invoke-RestMethod "http://127.0.0.1:18765/api/stocks/INFY?limit=1300" -TimeoutSec 10
            if ($stock.bars.Count -lt 200) { throw "Stock chart dataset smoke failed" }
            if ($health.app_version -ne "0.9.1-native-desktop") { throw "Wrong engine version: $($health.app_version)" }
            Write-Host "SOURCE BACKEND PASS - $($stock.bars.Count) chart bars"
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Package local engine source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "native-desktop-0.9.1\resources" | Out-Null
          Compress-Archive -Path "$env:SRE_ENGINE_ROOT\*" -DestinationPath "native-desktop-0.9.1\resources\SRE091_ENGINE_SOURCE.zip" -Force
          $iconDir = "native-desktop-0.9.1\src-tauri\icons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          @'
import struct, zlib, binascii
from pathlib import Path
w = h = 64
pixels = bytearray()
for y in range(h):
    pixels.append(0)
    for x in range(w):
        if 8 <= x <= 55 and 8 <= y <= 55:
            r,g,b,a = (16,29,52,255)
        else:
            r,g,b,a = (9,16,30,255)
        if (x,y) in {(14,45),(25,34),(34,39),(45,24),(54,16)}:
            r,g,b,a = (54,211,153,255)
        pixels.extend((r,g,b,a))
def chunk(kind, data):
    return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", binascii.crc32(kind + data) & 0xffffffff)
png = b"\x89PNG\r\n\x1a\n"
png += chunk(b"IHDR", struct.pack(">IIBBBBB", w,h,8,6,0,0,0))
png += chunk(b"IDAT", zlib.compress(bytes(pixels), 9))
png += chunk(b"IEND", b"")
header = struct.pack("<HHH", 0,1,1)
entry = struct.pack("<BBBBHHII", w,h,0,0,1,32,len(png),22)
Path(r"native-desktop-0.9.1\src-tauri\icons\icon.ico").write_bytes(header + entry + png)
'@ | python -
          $p = "native-desktop-0.9.1\src-tauri\tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.bundle.targets = @("nsis")
          $c.bundle.resources = @{"../resources/SRE091_ENGINE_SOURCE.zip"="resources/SRE091_ENGINE_SOURCE.zip"}
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding UTF8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-desktop-0.9.1/src-tauri

      - name: Install Tauri CLI
        working-directory: native-desktop-0.9.1
        run: npm install --no-audit --no-fund

      - name: Build native Windows installer
        working-directory: native-desktop-0.9.1
        run: npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Native Setup.exe missing" }
          Write-Host "SETUP: $($setup.FullName)"
          Write-Host "SIZE: $($setup.Length)"
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: SRE-0.9.1-Native-Setup
          path: native-desktop-0.9.1/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

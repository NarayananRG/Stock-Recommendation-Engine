name: V2 evidence handoff and improvement readiness
on:
  push:
    branches: [validation-v2-evidence-handoff-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V2 evidence handoff and 200-stock comparison regression
        run: |
          python .ci/recommendation_audit/test_ingest_v2_local_comparison.py -v
          python .ci/recommendation_audit/test_actual_snapshot_compare_v2.py -v
          python "NextGen Research/tests/run_recovery_snapshot_provenance_tests.py" -v
          python "NextGen Research/tests/run_complete_financial_coverage_v2_tests.py" -v
          python "NextGen Research/tests/run_mixed_event_shadow_tests.py"
          python .ci/native140/test_live_decision_v1.py

name: SRE V10 native Windows validation only
on:
  push:
    branches: [perf/sre-v10-native-validation-20261021]
    paths: [.github/workflows/sre-v10-native-validation.yml, .ci/sre-v10-validation/source.b64]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .ci/sre-v10-validation
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Restore code-only validation fixture
        shell: python
        run: |
          import base64,hashlib,io,zipfile
          from pathlib import Path
          payload=base64.b64decode(Path('.ci/sre-v10-validation/source.b64').read_text())
          assert hashlib.sha256(payload).hexdigest()=='7ecd752c050c2f8cd9ae274016d9d725b17ff2c7408451dd4461f3ea649e3c38'
          zipfile.ZipFile(io.BytesIO(payload)).extractall('.')
      - name: Install native test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas "polars>=1.32,<3" "pyarrow>=20,<30" fastapi pytest httpx uvicorn
      - name: Verify native source, persistence, recovery and rollback
        env:
          PYTHONPATH: v10work
          PYTHONWARNINGS: ignore
        run: python -m pytest -q v10bundle/tests --basetemp "$env:RUNNER_TEMP/sv10-unit" --junitxml native-windows-tests.xml
      - name: Record native runtime
        if: always()
        env:
          PYTHONPATH: v10work
        shell: python
        run: |
          import json,platform,sys,os
          from stock_app.replay_v10 import RUNTIME
          assert os.name=='nt'
          report={'platform':platform.platform(),'runtime':RUNTIME,'windows_native_execution':True}
          open('native-windows-runtime.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sre-v10-windows-${{ matrix.python }}
          path: |
            native-windows-tests.xml
            native-windows-runtime.json

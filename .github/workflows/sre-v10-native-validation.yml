name: Final SRE V10 performance correction native acceptance
on:
  push:
    branches: [perf/sre-v10-native-validation-20261021]
    paths: [.github/workflows/sre-v10-native-validation.yml, .ci/sre-v10-validation/source.b64]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .ci/sre-v10-validation
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Restore code-only fixture
        shell: python
        run: |
          from pathlib import Path
          import base64,hashlib,zipfile,io
          payload=base64.b64decode(Path('.ci/sre-v10-validation/source.b64').read_text())
          assert hashlib.sha256(payload).hexdigest()=="745c464fdd48fb1a5b5a05a27c7386096741bf2f347b62e3dc0976d9c640c86b"
          zipfile.ZipFile(io.BytesIO(payload)).extractall('.')
      - name: Install native test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas polars==2.0.0 pyarrow==26.0.0 fastapi pytest httpx uvicorn
      - name: Test parity, restart reuse, invalidation, recovery and installation
        env:
          PYTHONPATH: v10-final
          PYTHONWARNINGS: ignore
        run: python -m pytest -q v10-final-bundle/tests --basetemp "$env:RUNNER_TEMP/sv10-final" --junitxml native-windows-tests.xml
      - name: Record actual Windows runtime
        if: always()
        env:
          PYTHONPATH: v10-final
        shell: python
        run: |
          import os,platform,json
          from stock_app.replay_v10 import RUNTIME
          assert os.name=='nt'
          r={'platform':platform.platform(),'runtime':RUNTIME,'native_windows':True}
          Path=__import__('pathlib').Path
          Path('native-windows-runtime.json').write_text(json.dumps(r,indent=2))
          print(json.dumps(r))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sre-v10-final-windows-${{ matrix.python }}
          path: |
            native-windows-tests.xml
            native-windows-runtime.json

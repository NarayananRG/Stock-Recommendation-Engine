name: V2 recovery and recommendation integration validation
on:
  push:
    branches: [integration-v2-recovery-router-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric test dependencies
        run: python -m pip install numpy pandas requests
      - name: V2 complete financial coverage tests
        run: |
          python "NextGen Research/tests/run_complete_financial_coverage_v2_tests.py"
          python "NextGen Research/tests/run_current_universe_recovery_tests.py"
          python "NextGen Research/tests/run_fundamental_research_v2_phase2a2_mapping_tests.py"
          python "NextGen Research/tests/run_mixed_event_shadow_tests.py"
      - name: Integrated live recommendation and portfolio safety
        run: |
          python .ci/native140/test_live_decision_v1.py
          python .ci/recommendation_audit/test_position_metadata_batch.py
          python .ci/recommendation_audit/test_fundamental_pit_gate.py
          python .ci/recommendation_audit/test_paper_monitor_batch.py
          python .ci/recommendation_audit/test_rank_plan_batch.py
          python .ci/recommendation_audit/test_router_batch_sanity.py
          python .ci/recommendation_audit/test_technical_batch.py
          python .ci/recommendation_audit/test_technical_price_sanity.py
          python .ci/recommendation_audit/test_thesis_session_consistency.py
      - name: Technical and global evidence parity
        run: |
          cd .ci/recommendation_audit
          python -m unittest test_technical_v2_formulas test_technical_evidence_audit -v

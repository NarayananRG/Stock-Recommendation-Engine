name: Gate A final contract reconciliation
on:
  push:
    branches: [fix/gatea-final-contract-audit-20261022]
    paths: [.github/workflows/gatea-final-contract.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .ci/gatea-final-contract
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Restore audited installed-source fixtures
        shell: python
        run: |
          import base64,hashlib,zipfile,io,pathlib
          b=base64.b64decode(pathlib.Path('.ci/gatea-final-contract/source.b64').read_text())
          assert hashlib.sha256(b).hexdigest()=='e7bde5a817aa4007bc207e7096b1121778ea7179b5aae77e4d247753fe90aa75'
          zipfile.ZipFile(io.BytesIO(b)).extractall('.')
      - name: Install CI-only test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas polars==2.0.0 pyarrow==26.0.0 fastapi pytest httpx uvicorn
      - name: All scoped regression and reconciled legacy tests
        env:
          PYTHONPATH: gatea-fixed
          SRE_SOURCE: gatea-fixed
        run: python -m pytest gatea-tests/reconciled gatea-tests/test_holdings.py gatea-tests/test_v10_core.py gatea-tests/test_current_contract.py gatea-fixed/regression -q --junitxml=native-results.xml
      - name: Guarded install rollback and accounting preservation
        env:
          PYTHONPATH: gatea-fixed
          PY_PYTHON3: ${{ matrix.python }}
        run: python gatea-tests/install-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatea-final-contract-windows-${{ matrix.python }}
          path: native-results.xml

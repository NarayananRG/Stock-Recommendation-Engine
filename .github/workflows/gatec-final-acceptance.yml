name: Gate C final acceptance harness Windows portability
on:
  push:
    branches: [audit/gatec-final-acceptance-20261023]
    paths: [.github/workflows/gatec-final-acceptance.yml, tools/gatec-final/**]
  workflow_dispatch:
jobs:
  safeguards:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native WAL backup, readonly guards, isolated refresh contract tests
        run: python tools/gatec-final/test_acceptance.py
      - name: Full synthetic initial collector, backup and separate restore
        run: python tools/gatec-final/test_initial_integration.py
      - name: PowerShell parse
        shell: powershell
        run: |
          $errors=$null; $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/gatec-final/ACCEPT_SRE_WINDOWS.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

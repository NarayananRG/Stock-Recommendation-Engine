name: Validate Frozen Branch Shim

on:
  push:
    branches: [diag-stage6-parallel-20261016]
    paths:
      - ".github/workflows/diag-stage6-branch-shim.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-stage6:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: stage6_4a
            pattern: "Stage 6/tests/run_stage6_4a_tests.py"
            expected_branch: stage6-historical-analogue
          - suite: stage6_5x
            pattern: "Stage 6/tests/run_stage6_5*_tests.py"
            expected_branch: stage6-portfolio-intelligence
          - suite: stage6_6x
            pattern: "Stage 6/tests/run_stage6_6*_tests.py"
            expected_branch: stage6-persistent-thesis
          - suite: stage6_7x
            pattern: "Stage 6/tests/run_stage6_7*_tests.py"
            expected_branch: stage6-morning-revalidation
          - suite: stage6_8x
            pattern: "Stage 6/tests/run_stage6_8*_tests.py"
            expected_branch: stage6-prospective-shadow-validation
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen suite with frozen-CI compatibility
        shell: pwsh
        env:
          SRE_LEGACY_EXPECTED_BRANCH: ${{ matrix.expected_branch }}
          SRE_TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --disable-pip-version-check tzdata==2025.2 pandas numpy
          if ($LASTEXITCODE -ne 0) { throw "tzdata install failed" }

          $siteDir = Join-Path $env:RUNNER_TEMP "sitecustomize"
          New-Item -ItemType Directory -Force -Path $siteDir | Out-Null
          @'
          import os
          import subprocess
          _real_check_output = subprocess.check_output
          def _branch_query(args):
              if not isinstance(args, (list, tuple)):
                  return False
              values = [str(x) for x in args]
              return len(values) >= 2 and values[-2:] == ["branch", "--show-current"]
          def _compat_check_output(*popenargs, **kwargs):
              args = kwargs.get("args")
              if args is None and popenargs:
                  args = popenargs[0]
              expected = os.environ.get("SRE_LEGACY_EXPECTED_BRANCH", "")
              if expected and _branch_query(args):
                  text_mode = bool(kwargs.get("text") or kwargs.get("universal_newlines") or kwargs.get("encoding") is not None)
                  value = expected + "\n"
                  return value if text_mode else value.encode(kwargs.get("encoding") or "utf-8")
              return _real_check_output(*popenargs, **kwargs)
          subprocess.check_output = _compat_check_output
          '@ | Set-Content (Join-Path $siteDir "sitecustomize.py") -Encoding UTF8

          $stage6Root = (Resolve-Path "Stage 6").Path
          $env:PYTHONPATH = "$siteDir;$stage6Root"
          if (!(Test-Path "_git")) {
            New-Item -ItemType Junction -Path "_git" -Target (Resolve-Path ".git").Path | Out-Null
          }

          $contract = "Stage 6/contracts/market_context.schema.json"
          $tracked = (git rev-parse "HEAD:$contract").Trim()
          $raw = (git hash-object --no-filters -- "$contract").Trim()
          if ($tracked -ne $raw) { throw "RAW CONTRACT MISMATCH tracked=$tracked raw=$raw" }

          $tests = @(Get-ChildItem $env:SRE_TEST_PATTERN | Sort-Object Name)
          if ($tests.Count -eq 0) { throw "No tests matched $env:SRE_TEST_PATTERN" }
          foreach ($test in $tests) {
            $fixture = $null
            if ($test.Name -eq "run_stage6_8a_tests.py") {
              $runtimeDir = "Stage 6/runtime/prospective_validation"
              New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
              $fixture = Join-Path $runtimeDir ".gitignore"
              [IO.File]::WriteAllText($fixture, "*`n!.gitignore`n", [Text.UTF8Encoding]::new($false))
            }
            Write-Host "RUN $($test.Name) AS $env:SRE_LEGACY_EXPECTED_BRANCH"
            python $test.FullName
            $exit = $LASTEXITCODE
            if ($fixture -and (Test-Path $fixture)) { Remove-Item $fixture -Force }
            if ($exit -ne 0) { throw "FAILED $($test.Name)" }
          }

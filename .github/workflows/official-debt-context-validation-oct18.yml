name: Official debt ratio context validation
on:
  push:
    branches: [official-debt-context-validation-oct18]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline official debt context and ratio checks
        run: |
          python .ci/recommendation_audit/test_official_debt_contexts.py -v
          python .ci/recommendation_audit/test_official_supplement_selection.py -v
          python .ci/recommendation_audit/test_supplement_numeric_policy.py -v
          python .ci/recommendation_audit/test_triage_debt_equity_v2.py -v
      - name: Install recovery dependencies
        run: python -m pip install numpy pandas requests
      - name: Existing V2 financial and live router tests
        run: |
          python "NextGen Research/tests/run_complete_financial_coverage_v2_tests.py"
          python .ci/native140/test_live_decision_v1.py

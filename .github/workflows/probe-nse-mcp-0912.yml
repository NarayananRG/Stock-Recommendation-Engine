name: Probe NSE Bhavcopy MCP for Phase 3C

on:
  push:
    branches: [ui-0.9.12-phase3c-official-activation]
    paths:
      - ".github/workflows/probe-nse-mcp-0912.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe documented NSE MCP schemas only
        shell: pwsh
        run: |
          @'
          import json, time
          from urllib.request import Request, urlopen

          endpoint="https://mcp.nseindia.in/bhavcopy/cm/mcp"
          def post(payload, session=None):
              headers={"Content-Type":"application/json","Accept":"application/json, text/event-stream",
                       "User-Agent":"Stock-Recommendation-Engine official-data activation probe"}
              if session: headers["Mcp-Session-Id"]=session
              last=None
              for attempt in range(3):
                  try:
                      req=Request(endpoint,data=json.dumps(payload).encode(),headers=headers,method="POST")
                      with urlopen(req,timeout=30) as resp:
                          raw=resp.read().decode(); rh=dict(resp.headers.items())
                      if raw.startswith("event:"):
                          raw=next(x[5:] for x in raw.splitlines() if x.startswith("data:"))
                      return json.loads(raw),rh
                  except Exception as exc:
                      last=exc; time.sleep(1.5*(attempt+1))
              raise last

          init,h=post({"jsonrpc":"2.0","id":1,"method":"initialize","params":{
              "protocolVersion":"2025-03-26","capabilities":{},
              "clientInfo":{"name":"sre-phase3c-probe","version":"1.0"}}})
          sid=h.get("mcp-session-id") or h.get("Mcp-Session-Id")
          assert sid
          tools,_=post({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},sid)
          tm={x.get("name"):x for x in tools.get("result",{}).get("tools",[])}
          for name in ["get_stock_history","get_index_history","get_index_snapshot","search_symbols"]:
              print(name.upper()+"_SCHEMA",json.dumps(tm.get(name,{}).get("inputSchema",{}),sort_keys=True))
          '@ | python -

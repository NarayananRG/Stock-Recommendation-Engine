name: SRE full audit validation branch
on:
  push:
    branches:
      - automation-overnight-validation-20261018
    paths:
      - '.ci/overnight/**'
      - 'NextGen Research/fundamental_research_v2_phase2a/**'
      - 'NextGen Research/tests/run_current_universe_recovery_tests.py'
      - '.github/workflows/sre-full-audit-branch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sre-full-validation-branch
  cancel-in-progress: false
jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install numpy pandas requests
      - name: Compile audit and recovery files
        run: |
          python -m py_compile '.ci/overnight/overnight_validation.py'
          python -m py_compile 'NextGen Research/fundamental_research_v2_phase2a/current_universe_recovery.py'
          python -m py_compile 'NextGen Research/tests/run_current_universe_recovery_tests.py'
      - name: Execute all thirteen audit families
        env:
          SRE_AUDIT_REPORT_DIR: audit-output
        run: python '.ci/overnight/overnight_validation.py'
      - name: Preserve detailed results on all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-full-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14

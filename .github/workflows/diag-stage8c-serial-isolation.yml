name: Diagnose Stage 8C Serial Isolation

on:
  push:
    branches: [diag-stage6-parallel-20261016]
    paths:
      - ".github/workflows/diag-stage8c-serial-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serial-isolation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen-suite dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pandas numpy tzdata==2025.2
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }

      - name: Reproduce Stage5D dirty tree then isolate Stage8C
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Reproduce the serial release-gate contamination.
          foreach ($test in (Get-ChildItem "Stage 5D\tests\run_stage5d*_tests.py" | Sort-Object Name)) {
            Write-Host "RUN $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Stage5D reproduction failed: $($test.Name)" }
          }

          $dirtyBefore = @(git status --porcelain -- "Stage 5D")
          if ($dirtyBefore.Count -eq 0) {
            throw "Diagnostic did not reproduce Stage5D working-tree contamination"
          }
          Write-Host "REPRODUCED STAGE5D TEST CONTAMINATION:"
          $dirtyBefore | ForEach-Object { Write-Host $_ }

          # This is the proposed release-gate fix: restore only tracked Stage5D
          # mutations generated by the prior frozen tests. Do not alter HEAD.
          git restore --source=HEAD --worktree -- "Stage 5D"
          if ($LASTEXITCODE -ne 0) { throw "Stage5D working-tree restore failed" }

          $dirtyAfter = @(git status --porcelain -- "Stage 5D")
          if ($dirtyAfter.Count -ne 0) {
            Write-Host "STAGE5D STILL DIRTY AFTER RESTORE:"
            $dirtyAfter | ForEach-Object { Write-Host $_ }
            throw "Stage5D isolation incomplete"
          }
          Write-Host "STAGE5D SERIAL ISOLATION PASS"

          # Frozen Stage8 harness compatibility used by the main release gate.
          $siteDir = Join-Path $env:RUNNER_TEMP "sitecustomize"
          New-Item -ItemType Directory -Force -Path $siteDir | Out-Null
          @'
          import os
          import subprocess
          _real_check_output = subprocess.check_output
          def _branch_query(args):
              if not isinstance(args, (list, tuple)):
                  return False
              values = [str(x) for x in args]
              return len(values) >= 2 and values[-2:] == ["branch", "--show-current"]
          def _compat_check_output(*popenargs, **kwargs):
              args = kwargs.get("args")
              if args is None and popenargs:
                  args = popenargs[0]
              expected = os.environ.get("SRE_LEGACY_EXPECTED_BRANCH", "")
              if expected and _branch_query(args):
                  text_mode = bool(kwargs.get("text") or kwargs.get("universal_newlines") or kwargs.get("encoding") is not None)
                  value = expected + "\n"
                  return value if text_mode else value.encode(kwargs.get("encoding") or "utf-8")
              return _real_check_output(*popenargs, **kwargs)
          subprocess.check_output = _compat_check_output
          '@ | Set-Content (Join-Path $siteDir "sitecustomize.py") -Encoding UTF8

          $stage6Root = (Resolve-Path "Stage 6").Path
          $env:PYTHONPATH = "$siteDir;$stage6Root"
          if (!(Test-Path "_git")) {
            New-Item -ItemType Junction -Path "_git" -Target (Resolve-Path ".git").Path | Out-Null
          }

          $env:SRE_LEGACY_EXPECTED_BRANCH = "stage6-prospective-shadow-validation"
          $runtimeDir = "Stage 6/runtime/prospective_validation"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $fixture = Join-Path $runtimeDir ".gitignore"
          [IO.File]::WriteAllText($fixture, "*`n!.gitignore`n", [Text.UTF8Encoding]::new($false))
          python "Stage 6\tests\run_stage6_8a_tests.py"
          $exit = $LASTEXITCODE
          Remove-Item $fixture -Force -ErrorAction SilentlyContinue
          if ($exit -ne 0) { throw "Stage 8A failed after isolation" }

          python "Stage 6\tests\run_stage6_8b_tests.py"
          if ($LASTEXITCODE -ne 0) { throw "Stage 8B failed after isolation" }

          $env:SRE_LEGACY_EXPECTED_BRANCH = ""
          python "Stage 6\tests\run_stage6_8c_tests.py"
          if ($LASTEXITCODE -ne 0) { throw "Stage 8C failed after Stage5D isolation" }

          Write-Host "STAGE8C SERIAL-CONTAMINATION FIX VALIDATED"

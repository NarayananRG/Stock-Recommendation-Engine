name: Gate A read-only snapshot collector
on:
  push:
    branches: ['test/gatea-snapshot-collector-20261022']
    paths: ['.ci/gatea-collector/**', '.github/workflows/gatea-snapshot-collector.yml']
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .ci/gatea-collector
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: '& ./.ci/gatea-collector/Test-Collector.ps1'
      - name: Test PowerShell 7
        if: always()
        shell: pwsh
        run: '& ./.ci/gatea-collector/Test-Collector.ps1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatea-collector-native-results
          path: .ci/gatea-collector/test-results-*.json

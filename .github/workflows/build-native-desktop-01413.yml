name: Build SRE 0.14.13 Paper Trading Repair

on:
  push:
    branches: [validation-v2-rebuild, fix-paper-trading-root-causes-20261016, fix-gate-a-fundamental-data-stale-20261020]
    paths:
      - ".ci/native098/**"
      - ".ci/native099/**"
      - ".ci/native100/**"
      - ".ci/native101/**"
      - ".ci/native102/**"
      - ".ci/native103/**"
      - ".ci/native104/**"
      - ".ci/native105/**"
      - ".ci/native106/**"
      - ".ci/native140/**"
      - ".ci/native141/**"
      - ".ci/native142/**"
      - ".ci/native143/**"
      - ".ci/native144/**"
      - ".ci/native145/**"
      - ".ci/native146/**"
      - ".ci/native147/**"
      - ".ci/native148/**"
      - ".ci/native150/**"
      - ".ci/native151/**"
      - ".ci/native152/**"
      - ".ci/native154/**"
      - ".ci/native155/**"
      - ".gitignore"
      - ".gitattributes"
      - "Stage 6/runtime/**"
      - ".ci/native108/**"
      - ".ci/native109/**"
      - ".ci/native110/**"
      - ".ci/native111/**"
      - ".ci/native112/**"
      - ".ci/native113/**"
      - ".ci/native114/**"
      - ".ci/native115/**"
      - ".ci/native116/**"
      - ".ci/native117/**"
      - ".ci/native118/**"
      - ".ci/native119/**"
      - ".ci/native140/**"
      - "Stage 6/tests/run_phase7_official_daily_refresh_tests.py"
      - "Stage 6/tests/run_phase7_refresh_contract_consistency_tests.py"
      - "Stage 6/tests/run_phase81_validation_tests.py"
      - "Stage 6/tests/run_phase81_validation_complete_tests.py"
      - "Stage 6/tests/run_phase81_runtime_fix_tests.py"
      - "Stage 6/tests/run_phase81_formatter_hotfix_tests.py"
      - "Stage 6/tests/run_phase81_paper_journal_duplicate_tests.py"
      - ".github/workflows/build-native-desktop-01413.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sre-native-01413-final
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify byte-stable frozen Stage 6 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = (Get-Location).Path
          $targets = @(Get-ChildItem "Stage 6\contracts" -Filter "*.json" -File | Sort-Object Name)
          if ($targets.Count -eq 0) { throw "No Stage 6 frozen contract JSON files found" }
          foreach ($file in $targets) {
            $path = $file.FullName.Substring($repoRoot.Length + 1).Replace("\", "/")
            $tracked = (git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Unable to resolve tracked blob for $path" }
            $raw = (git hash-object --no-filters -- "$path").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Unable to hash raw working-tree bytes for $path" }
            $filtered = (git hash-object -- "$path").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Unable to hash filtered working-tree bytes for $path" }
            Write-Host "$path TRACKED=$tracked RAW=$raw FILTERED=$filtered"
            if ($raw -ne $tracked) {
              throw "Frozen Stage 6 contract raw bytes differ from tracked Git blob: $path"
            }
            if ($filtered -ne $tracked) {
              throw "Frozen Stage 6 contract filtered hash differs from tracked Git blob: $path"
            }
          }
          Write-Host "FROZEN STAGE 6 BYTE IDENTITY PASS"

      - name: Decode verified native desktop shell
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".ci\native091\source.part.*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 native shell chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if ($b64.Length -ne 39284) { throw "Native shell base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\native-desktop-shell.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "86dd430e933d044d08ae4637787eff52369b46b7ee1013e48af7851d9ea88fcc") { throw "Native shell hash mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath "." -Force

          Copy-Item ".ci\native154\main_dynamic_port_python.rs" "native-desktop-0.9.1\src-tauri\src\main.rs" -Force
          Copy-Item ".ci\native154\Cargo.toml" "native-desktop-0.9.1\src-tauri\Cargo.toml" -Force

          $main = "native-desktop-0.9.1\src-tauri\src\main.rs"
          $m = Get-Content $main -Raw
          $m = $m.Replace('0.14.11-missing-evidence-coverage-repair','0.14.13-paper-trading-repair').Replace('native-engine-0.14.11','native-engine-0.14.13').Replace('.sre01411-ready','.sre01413-ready').Replace('engine-v01411-staging','engine-v01413-staging').Replace('native-desktop-0.14.11.log','native-desktop-0.14.13.log').Replace('SRE01411_ENGINE_SOURCE.zip','SRE01413_ENGINE_SOURCE.zip')
          Set-Content $main $m -Encoding UTF8
          if ($m -notmatch 'native-engine-0\.14\.13') { throw "Versioned 0.14.13 engine directory missing" }
          if ($m -notmatch '\.sre01413-ready') { throw "Versioned 0.14.13 ready marker missing" }
          if ($m -notmatch 'engine-v01413-staging') { throw "Versioned 0.14.13 staging directory missing" }
          if ($m -notmatch 'native-desktop-0\.14\.13\.log') { throw "Versioned 0.14.13 startup log missing" }
          if ($m -notmatch 'PACKAGED_RUNTIME_FINGERPRINT' -or $m -notmatch 'EXTRACTION_REQUIRED') { throw "Content-addressed runtime extraction logging missing" }
          if ($m -notmatch 'sha256_file') { throw "Runtime bundle SHA-256 validation missing" }
          if ($m -notmatch 'choose_free_port') { throw "Dynamic-port launcher missing" }
          if ($m -notmatch 'health_matches') { throw "Backend-version handshake missing" }
          if ($m -match 'const PORT') { throw "Fixed desktop port must not exist in 0.9.9" }
          if ($m -notmatch '0.14.13-paper-trading-repair') { throw "Wrong native launcher version" }
          if ($m -notmatch 'STOCK_MODERN_UI_PREVIEW", "0') { throw "Preview must remain disabled" }

          $cargo = "native-desktop-0.9.1\src-tauri\Cargo.toml"
          (Get-Content $cargo -Raw).Replace('version = "0.9.1"','version = "0.14.13"') | Set-Content $cargo -Encoding UTF8

          $pkg = "native-desktop-0.9.1\package.json"
          $j = Get-Content $pkg -Raw | ConvertFrom-Json
          $j.version = "0.14.13"
          $j | ConvertTo-Json -Depth 20 | Set-Content $pkg -Encoding UTF8

      - name: Reconstruct canonical engine and apply 0.9.2 and 0.9.3 overlays
        shell: pwsh
        run: |
          $dir = "stock-engine-ultra-ui-0.8.5-source-with-windows-builder"
          $parts = Get-ChildItem -Path $dir -Filter "source.part.*.b64" | Sort-Object Name
          if (!$parts) { throw "Canonical 0.8.5 source parts missing" }
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = "$env:RUNNER_TEMP\sre085.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "915425e7027fd6145298e3e467b678e6f5998a895d85c4c18a9cfec033df7edc") { throw "Canonical source hash mismatch: $hash" }

          $extract = "$env:RUNNER_TEMP\engine-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $engine = Join-Path $extract "StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE"
          if (!(Test-Path "$engine\requirements-v1.txt")) { throw "Canonical engine root missing" }

          $overlay092Paths = @(
            ".ci\native092\overlay.part.00.b64",
            ".ci\native092\overlay.part.01.b64",
            ".ci\native092\overlay.part.02a.b64",
            ".ci\native092\overlay.part.02b.b64",
            ".ci\native092\overlay.part.03.b64",
            ".ci\native092\overlay.part.04.b64",
            ".ci\native092\overlay.part.05.b64",
            ".ci\native092\overlay.part.06.b64"
          )
          $overlay092B64 = ($overlay092Paths | ForEach-Object { Get-Content $_ -Raw }) -join ""
          if ($overlay092B64.Length -ne 42016) { throw "0.9.2 overlay base64 length mismatch: $($overlay092B64.Length)" }
          $overlay092Zip = "$env:RUNNER_TEMP\sre092-overlay.zip"
          [IO.File]::WriteAllBytes($overlay092Zip, [Convert]::FromBase64String($overlay092B64))
          $overlay092Hash = (Get-FileHash $overlay092Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlay092Hash -ne "ed91eb0ec54c562f2965a730174bbf422c4ae2ba6852f9e046305593cf96d1d8") { throw "0.9.2 overlay hash mismatch: $overlay092Hash" }
          Expand-Archive -LiteralPath $overlay092Zip -DestinationPath $engine -Force

          $overlay093Paths = 0..8 | ForEach-Object { ".ci\native093\overlay.part.{0:D2}.b64" -f $_ }
          $overlay093B64 = ($overlay093Paths | ForEach-Object { Get-Content $_ -Raw }) -join ""
          if ($overlay093B64.Length -ne 46088) { throw "0.9.3 overlay base64 length mismatch: $($overlay093B64.Length)" }
          $overlay093Zip = "$env:RUNNER_TEMP\sre093-overlay.zip"
          [IO.File]::WriteAllBytes($overlay093Zip, [Convert]::FromBase64String($overlay093B64))
          $overlay093Hash = (Get-FileHash $overlay093Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlay093Hash -ne "af2e954e71f906ab7331408cac11a78fc97446ca320c6bed7e71eab06b3421c8") { throw "0.9.3 overlay hash mismatch: $overlay093Hash" }
          Expand-Archive -LiteralPath $overlay093Zip -DestinationPath $engine -Force

          if (!(Test-Path "$engine\modern_ui\api.py")) { throw "0.9.3 engine overlay failed" }
          "SRE_ENGINE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply 0.9.4 fast data-source hotfix
        shell: pwsh
        run: |
          $b64 = ''
          $script = "$env:RUNNER_TEMP\\patch094.py"
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String($b64))
          python $script
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }

      - name: Apply 0.9.7 legacy data autodiscovery
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os

          root = Path(os.environ["SRE_ENGINE_ROOT"])
          api = root / "modern_ui" / "api.py"
          s = api.read_text(encoding="utf-8")
          s = s.replace('APP_VERSION = "0.9.4-data-source-hotfix"', 'APP_VERSION = "0.9.7-legacy-data-autodiscovery"')

          anchor = '    @staticmethod\n    def _normalize_data_repo_root'
          pos = s.index(anchor)
          helpers = '''    @staticmethod
              def _legacy_frozen_cache_roots(root: Path) -> list[Path]:
                  candidates = [
                      root / "stage2_2_1" / "data" / "frozen",
                      root / "Stage 2.2.2 Final" / "stage2_2_1" / "data" / "frozen",
                  ]
                  return [p for p in candidates if p.exists() and any(p.glob("*.csv"))]

              @classmethod
              def _market_cache_roots(cls, root: Path) -> tuple[list[Path], str, str]:
                  official = [p for p in cls._official_cache_roots(root) if p.exists() and any(p.glob("*.csv"))]
                  if official:
                      return official, "REAL_OFFICIAL_DATA", "OFFICIAL_NSE_OHLCV"
                  legacy = cls._legacy_frozen_cache_roots(root)
                  if legacy:
                      return legacy, "REAL_FROZEN_HISTORY", "LEGACY_FROZEN_OHLCV"
                  return [], "NO_REAL_DATA_CONNECTED", "NONE"

          '''
          s = s[:pos] + helpers + s[pos:]

          old = '''        for idx in range(max(0, len(parts) - 3)):
                      if parts[idx:idx + 4] == ["data", "normalized", "nse_official", "equity_bhavcopy"]:
                          return Path(*root.parts[:idx]).resolve()
                  return root
          '''
          new = '''        for idx in range(max(0, len(parts) - 3)):
                      if parts[idx:idx + 4] == ["data", "normalized", "nse_official", "equity_bhavcopy"]:
                          return Path(*root.parts[:idx]).resolve()
                  for idx in range(max(0, len(parts) - 2)):
                      if parts[idx:idx + 3] == ["stage2_2_1", "data", "frozen"]:
                          return Path(*root.parts[:idx]).resolve()
                  return root
          '''
          if old not in s:
              raise RuntimeError("normalize contract missing")
          s = s.replace(old, new, 1)

          old = '        roots = self._official_cache_roots(root)\n        files: list[Path] = []'
          if old not in s:
              raise RuntimeError("inspect roots contract missing")
          s = s.replace(old, '        roots, data_mode, provenance = self._market_cache_roots(root)\n        files: list[Path] = []', 1)

          marker = '            "cache_roots": [str(p) for p in roots if p.exists()],'
          pos = s.index(marker)
          s = s[:pos + len(marker)] + '\n            "data_mode": data_mode,\n            "provenance": provenance,' + s[pos + len(marker):]

          old = '        roots = self._official_cache_roots(root)'
          if old not in s:
              raise RuntimeError("bind roots contract missing")
          s = s.replace(old, '        roots, _, _ = self._market_cache_roots(root)', 1)

          old = '"mode": "REAL_OFFICIAL_DATA" if current["ohlcv_ready"] else ("PREVIEW" if self.preview_mode else "NO_REAL_DATA_CONNECTED")'
          if old not in s:
              raise RuntimeError("mode contract missing")
          s = s.replace(old, '"mode": current.get("data_mode") if current["ohlcv_ready"] else ("PREVIEW" if self.preview_mode else "NO_REAL_DATA_CONNECTED")', 1)

          s = s.replace(
              'No official NSE OHLCV cache was found under that folder. Select the Stock-Recommendation-Engine repository that contains data/normalized/nse_official/equity_bhavcopy.',
              'No usable OHLCV history was found under that repository. Expected either data/normalized/nse_official/equity_bhavcopy or stage2_2_1/data/frozen.',
              1,
          )
          s = s.replace('Real official market data is not connected.', 'Real market history is not connected.', 1)
          api.write_text(s, encoding="utf-8")

          js = root / "modern_ui" / "frontend" / "app.js"
          t = js.read_text(encoding="utf-8")
          t = t.replace("d.mode==='REAL_OFFICIAL_DATA'", "String(d.mode||'').startsWith('REAL_')")
          t = t.replace("ds.mode==='REAL_OFFICIAL_DATA'", "String(ds.mode||'').startsWith('REAL_')")
          t = t.replace("official stock histories", "stock histories")
          t = t.replace("Real official OHLCV repository is not connected", "Real OHLCV repository is not connected")
          t = t.replace("Select the repository that contains data/normalized/nse_official/equity_bhavcopy", "Select your Stock-Recommendation-Engine repository; official NSE cache and stage2_2_1/data/frozen are supported")
          js.write_text(t, encoding="utf-8")

          assert 'APP_VERSION = "0.9.7-legacy-data-autodiscovery"' in api.read_text(encoding="utf-8")
          assert "REAL_FROZEN_HISTORY" in api.read_text(encoding="utf-8")
          assert "LEGACY_FROZEN_OHLCV" in api.read_text(encoding="utf-8")
          print("0.9.7 legacy data autodiscovery applied")
          '@ | python -

      - name: Apply tested 0.9.8 correctness-state overlay
        shell: pwsh
        run: |
          $b64 = Get-Content ".ci\native098\overlay.b64" -Raw
          if ($b64.Length -ne 50728) { throw "0.9.8 overlay base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\sre098-overlay.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "845b34e3e06d2101241bf36c2b99a7c934f4f25ca0cbfb2baa3e53cf969f2fe3") { throw "0.9.8 overlay hash mismatch: $hash" }
          $tmp = "$env:RUNNER_TEMP\sre098-overlay"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          Copy-Item "$tmp\api.py" "$env:SRE_ENGINE_ROOT\modern_ui\api.py" -Force
          Copy-Item "$tmp\app.js" "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js" -Force
          Copy-Item "$tmp\index.html" "$env:SRE_ENGINE_ROOT\modern_ui\frontend\index.html" -Force
          Copy-Item "$tmp\styles.css" "$env:SRE_ENGINE_ROOT\modern_ui\frontend\styles.css" -Force
          $api = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\api.py" -Raw
          $js = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js" -Raw
          if ($api -notmatch 'APP_VERSION = "0.9.8-correctness-state"') { throw "0.9.8 backend identity missing before Phase 2 patch" }
          if ($api -notmatch 'active_analysis_run.json') { throw "Persistent active-run contract missing" }
          if ($api -notmatch 'unused_cash_explanation') { throw "Unused-cash explanation contract missing" }
          if ($js -notmatch 'MEETS TARGET' -or $js -notmatch 'BELOW TARGET') { throw "Target-status UI contract missing" }
          if ($js -notmatch 'activeRunShort') { throw "Active Run ID UI contract missing" }
          node --check "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\modern_ui\api.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          Write-Host "0.9.8 EXACT OVERLAY PASS"

      - name: Apply Phase 2 baseline allocation and executability V2
        shell: pwsh
        run: |
          python ".ci\native099\patch099.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\stock_app\allocation.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\stock_app\historical.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\modern_ui\api.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          node --check "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $api = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\api.py" -Raw
          $alloc = Get-Content "$env:SRE_ENGINE_ROOT\stock_app\allocation.py" -Raw
          $hist = Get-Content "$env:SRE_ENGINE_ROOT\stock_app\historical.py" -Raw
          $html = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\frontend\index.html" -Raw
          if ($api -notmatch '0.9.9-allocation-executability-v2') { throw "0.9.9 backend identity missing" }
          if ($alloc -notmatch 'SINGLE_ELIGIBLE_FULL_CAPITAL') { throw "Single-stock exception missing" }
          if ($alloc -notmatch 'single_eligible_stock_exception') { throw "Phase 2 policy metadata missing" }
          if ($hist -notmatch 'INDEX_') { throw "Market-index exclusion missing" }
          if ($html -notmatch 'Cash affordable' -or $html -notmatch 'Executable') { throw "Opportunity executability filters missing" }
          Write-Host "0.9.9 PHASE-2 PATCH PASS"

      - name: Apply Phase 3 freshness and provenance foundation
        shell: pwsh
        run: |
          python ".ci\\native100\\patch100.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\\modern_ui\\api.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          node --check "$env:SRE_ENGINE_ROOT\\modern_ui\\frontend\\app.js"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $api = Get-Content "$env:SRE_ENGINE_ROOT\\modern_ui\\api.py" -Raw
          $js = Get-Content "$env:SRE_ENGINE_ROOT\\modern_ui\\frontend\\app.js" -Raw
          if ($api -notmatch '0.9.10-phase3-foundation') { throw "0.9.10 backend identity missing" }
          if ($api -notmatch '_phase3_freshness_contract') { throw "Phase 3 freshness gate missing" }
          if ($api -notmatch 'analysis_data_current') { throw "Phase 3 analysis-current flag missing" }
          if ($js -notmatch 'freshness_gate') { throw "Phase 3 freshness UI label missing" }
          if (!(Test-Path "$env:SRE_ENGINE_ROOT\\phase3\\data_foundation_policy_v1.json")) { throw "Phase 3 policy file missing" }
          Write-Host "0.9.10 PHASE-3 FOUNDATION PATCH PASS"

      - name: Apply Phase 3B official universe and identity foundation
        shell: pwsh
        run: |
          python ".ci\native101\patch101.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\stock_app\official_universe.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\modern_ui\api.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          node --check "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $api = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\api.py" -Raw
          $universe = Get-Content "$env:SRE_ENGINE_ROOT\stock_app\official_universe.py" -Raw
          if ($api -notmatch '0.9.11-phase3b-official-data') { throw "0.9.11 backend identity missing" }
          if ($universe -notmatch 'OfficialUniverseCatalog') { throw "Official universe catalog missing" }
          if ($universe -notmatch 'MIN_IDENTITY_COVERAGE = 0.98') { throw "Identity coverage gate missing" }
          if ($universe -notmatch 'MIN_HISTORY_COVERAGE = 0.95') { throw "History coverage gate missing" }
          if (!(Test-Path "$env:SRE_ENGINE_ROOT\phase3\official_market_data_contract_v1.json")) { throw "Phase 3B contract missing" }
          Write-Host "0.9.11 PHASE-3B OFFICIAL DATA PATCH PASS"

      - name: Apply 0.9.12 universe visibility hotfix
        shell: pwsh
        run: |
          python ".ci\native102\patch102.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          python -m py_compile "$env:SRE_ENGINE_ROOT\modern_ui\api.py"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          node --check "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js"
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $api = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\api.py" -Raw
          $js = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\frontend\app.js" -Raw
          $html = Get-Content "$env:SRE_ENGINE_ROOT\modern_ui\frontend\index.html" -Raw
          if ($api -notmatch '0.9.12-phase3c-universe-visibility') { throw "0.9.12 backend identity missing" }
          if ($js -notmatch 'history loaded') { throw "Loaded-history visibility text missing" }
          if ($html -notmatch '<small>universe</small>') { throw "Universe orb label missing" }
          Write-Host "0.9.12 UNIVERSE VISIBILITY HOTFIX PASS"

      - name: 0.9.12 dashboard visibility regression
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $engine = "$env:SRE_ENGINE_ROOT"
          $data = "$env:RUNNER_TEMP\sre0912-appdata"
          $env:STOCK_MODERN_UI_PREVIEW = "0"

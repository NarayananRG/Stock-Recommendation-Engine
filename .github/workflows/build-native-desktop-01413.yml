      - name: Phase 6 first-launch, current-data and Combined API regression
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0 pandas numpy
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $engine="$env:SRE_ENGINE_ROOT"
          $data="$env:RUNNER_TEMP\sre0121-fresh-appdata"
          if(Test-Path $data){Remove-Item $data -Recurse -Force}
          $env:STOCK_MODERN_UI_PREVIEW="0"
          $env:STOCK_REAL_DATA_REPO_ROOT=$engine
          $args=@("$engine\run_modern_ui.py","--no-browser","--host","127.0.0.1","--port","18774","--repo-root",$engine,"--app-data-dir",$data)
          $p=Start-Process -FilePath python -ArgumentList $args -PassThru -NoNewWindow
          try {
            $ok=$false
            for($i=0;$i -lt 90;$i++){
              Start-Sleep -Milliseconds 400
              if($p.HasExited){throw "Phase 6 fresh backend exited early"}
              try{$health=Invoke-RestMethod "http://127.0.0.1:18774/api/health" -TimeoutSec 2;if($health.status -eq "ok"){$ok=$true;break}}catch{}
            }
            if(!$ok){throw "Phase 6 fresh backend health timed out"}
            if($health.app_version -ne "0.13.5-phase8-paper-journal-hotfix"){throw "Wrong Phase 6 version"}

            $source=Invoke-RestMethod "http://127.0.0.1:18774/api/data-source" -TimeoutSec 20
            if($source.mode -ne "REAL_OFFICIAL_DATA"){throw "Official market bundle not active: $($source.mode)"}
            if([int]$source.active.stock_files -lt 190){throw "Current equity history coverage below 190: $($source.active.stock_files)"}
            if([double]$source.active.history_coverage -lt 0.95){throw "Current NIFTY200 history coverage below 95%"}
            # The downloaded official archive is a dated fixture. Verify its
            # real freshness state; never relabel an old cache as current.
            $fixtureDate = [datetime]::Parse([string]$source.active.latest_session).Date
            $fixtureLag = 0
            for ($cursor = $fixtureDate.AddDays(1); $cursor -le (Get-Date).Date; $cursor = $cursor.AddDays(1)) {
              if ($cursor.DayOfWeek -notin @([DayOfWeek]::Saturday, [DayOfWeek]::Sunday)) { $fixtureLag++ }
            }
            if ([bool]$source.active.analysis_data_current -ne ($fixtureLag -le 2)) { throw "Official fixture freshness classification mismatch" }
            Write-Host "DATED OFFICIAL FIXTURE: session=$fixtureDate business-day-lag=$fixtureLag current=$($source.active.analysis_data_current)"

            $dash=Invoke-RestMethod "http://127.0.0.1:18774/api/dashboard" -TimeoutSec 20
            if($null -ne $dash.active_run){throw "Fresh Phase 6 launch silently activated a historical run"}
            if($dash.target_state.explicit){throw "Fresh Phase 6 launch invented a target"}
            if(@($dash.opportunities).Count -ne 0){throw "Fresh Phase 6 launch exposed old opportunities"}

            $combined=Invoke-RestMethod "http://127.0.0.1:18774/api/stocks/INFY/combined-v2" -TimeoutSec 60
            if($combined.schema -ne "SRE_COMBINED_PREDICTION_V2"){throw "Combined V2 endpoint schema missing"}
            if($combined.authority -ne "SHADOW_ONLY"){throw "Combined V2 authority changed"}
            if($combined.target_used_in_score){throw "User target leaked into Combined V2"}
            if($combined.promotion_allowed){throw "Combined V2 promoted unexpectedly"}

            $rank=Invoke-RestMethod "http://127.0.0.1:18774/api/combined-v2/rankings?limit=20" -TimeoutSec 30
            if($rank.authority -ne "SHADOW_ONLY" -or $rank.production_rank_changed){throw "Combined shadow ranking authority violation"}

            $root=Invoke-WebRequest "http://127.0.0.1:18774/" -TimeoutSec 10
            $appjs=(Invoke-WebRequest "http://127.0.0.1:18774/assets/app.js" -TimeoutSec 10).Content
            if($root.Content -notmatch 'combinedV2Panel'){throw "Combined V2 panel absent"}
            if($appjs -notmatch 'TOP WATCH CANDIDATE'){throw "Overview watch-label fix absent"}
            Write-Host "PHASE6 FRESH/CURRENT/COMBINED API PASS"
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force}
          }


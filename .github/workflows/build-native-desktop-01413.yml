          @'
          import math, os, sys
          from pathlib import Path
          import numpy as np
          import pandas as pd
          sys.path.insert(0, os.environ["SRE_ENGINE_ROOT"])
          from stock_app.technical_v2 import analyze, point_in_time_prefix_audit

          n=900
          dates=pd.bdate_range("2023-01-02",periods=n)
          i=np.arange(n,dtype=float)
          close=700.0*np.exp(0.00055*i+0.035*np.sin(i/23.0)+0.012*np.cos(i/9.0))
          op=close*(1.0+0.002*np.sin(i/5.0))
          hi=np.maximum(op,close)*(1.006+0.003*np.abs(np.sin(i/7.0)))
          lo=np.minimum(op,close)*(1.0-0.006-0.003*np.abs(np.cos(i/11.0)))
          vol=1_200_000+(i%37)*11000+90000*np.sin(i/17.0)
          stock=pd.DataFrame({"Date":dates,"Open":op,"High":hi,"Low":lo,"Close":close,"Volume":vol})

          bclose=18000.0*np.exp(0.00035*i+0.018*np.sin(i/31.0))
          bop=bclose*(1.0+0.001*np.sin(i/6.0))
          bench=pd.DataFrame({"Date":dates,"Open":bop,"High":np.maximum(bop,bclose)*1.004,"Low":np.minimum(bop,bclose)*0.996,"Close":bclose,"Volume":0})

          result=analyze(stock,bench,horizon_sessions=20)
          assert result["schema"]=="SRE_TECHNICAL_INTELLIGENCE_V2",result
          assert result["authority"]=="SHADOW_ONLY",result
          assert result["shadow_challenger"]["promotion_allowed"] is False,result
          assert result["technical_score"] is not None and 0<=result["technical_score"]<=100,result
          assert result["evidence_coverage"]>=0.80,result
          assert result["trend"]["ema20"] is not None and result["trend"]["ema200"] is not None,result["trend"]
          assert result["momentum"]["macd_hist"] is not None and result["momentum"]["adx14"] is not None,result["momentum"]
          assert result["momentum"]["stoch_k14"] is not None and result["momentum"]["roc20_pct"] is not None,result["momentum"]
          assert result["volatility"]["bb_bandwidth_pct"] is not None and result["volatility"]["atr_pct"] is not None,result["volatility"]
          assert result["volume_flow"]["cmf20"] is not None and result["volume_flow"]["obv"] is not None,result["volume_flow"]
          assert result["structure"]["support20"] is not None and result["structure"]["resistance20"] is not None,result["structure"]
          assert result["multi_timeframe"]["weekly_rsi14"] is not None,result["multi_timeframe"]
          assert result["relative_strength"]["rs20_vs_nifty"] is not None,result["relative_strength"]
          assert result["historical_analogues"]["sample_size"]>=10,result["historical_analogues"]

          pit=point_in_time_prefix_audit(stock,bench,checkpoints=5)
          assert pit["status"]=="PASS",pit

          wf=[]
          stock_i=stock.set_index("Date")
          for end in range(360,n-20,80):
              snap=analyze(stock.iloc[:end+1].copy(),bench.iloc[:end+1].copy(),horizon_sessions=20)
              score=snap.get("technical_score")
              if score is None: continue
              now=float(stock_i.iloc[end]["Close"]);future=float(stock_i.iloc[end+20]["Close"])
              wf.append((float(score),future/now-1.0))
          assert len(wf)>=6,wf
          corr=pd.Series([x[0] for x in wf]).rank().corr(pd.Series([x[1] for x in wf]).rank(),method="pearson")
          assert math.isfinite(float(corr)),corr

          allocation=(Path(os.environ["SRE_ENGINE_ROOT"])/"stock_app"/"allocation.py").read_text(encoding="utf-8")
          assert "technical_v2" not in allocation.lower(),"Phase 4 shadow data leaked into allocation authority"
          print("PHASE4 TECHNICAL/PIT/WALK-FORWARD REGRESSION PASS")
          print("Shadow checkpoints:",len(wf),"Spearman:",round(float(corr),4))
          '@ | python -


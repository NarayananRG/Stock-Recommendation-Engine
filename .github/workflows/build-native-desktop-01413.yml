          base=combine(prediction,technical,fundamental,analysis_data_current=True)
          low_target=combine({**prediction,"target_status":"MEETS TARGET","target_return_request":0.05},technical,fundamental,analysis_data_current=True)
          high_target=combine({**prediction,"target_status":"BELOW TARGET","target_return_request":0.25},technical,fundamental,analysis_data_current=True)
          stale=combine(prediction,technical,fundamental,analysis_data_current=False)

          assert base["schema"]=="SRE_COMBINED_PREDICTION_V2",base

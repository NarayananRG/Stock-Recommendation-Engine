      - name: Build deterministic legacy frozen-data fixture
        shell: pwsh
        run: |
          $fixture = "$env:RUNNER_TEMP\sre099-legacy-repo"
          $cache = Join-Path $fixture "stage2_2_1\data\frozen"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:SRE099_FIXTURE_ROOT = $fixture
          @'
          from pathlib import Path
          import csv, datetime, math, os

          root = Path(os.environ["SRE099_FIXTURE_ROOT"])
          cache = root / "stage2_2_1" / "data" / "frozen"
          symbols = ["INFY", "TCS", "RELIANCE", "HDFCBANK", "SUNPHARMA", "LT"]
          start = datetime.date(2023, 1, 2)

          for si, symbol in enumerate(symbols):
              d = start
              price = 350.0 + si * 120.0
              rows = []
              i = 0
              while len(rows) < 760:
                  if d.weekday() < 5:
                      seasonal = math.sin(i / 13 + si) * 0.012 + math.cos(i / 31 + si) * 0.007
                      drift = 0.00035 + (si - 2) * 0.00003
                      close = price * (1 + drift + seasonal * 0.08)
                      op = price * (1 + math.sin(i / 7 + si) * 0.002)
                      hi = max(op, close) * (1.006 + abs(math.sin(i / 9)) * 0.004)
                      lo = min(op, close) * (1 - 0.006 - abs(math.cos(i / 11)) * 0.004)
                      vol = 1_000_000 + si * 120_000 + (i % 37) * 9_000
                      rows.append([d.isoformat(), f"{op:.2f}", f"{hi:.2f}", f"{lo:.2f}", f"{close:.2f}", str(vol)])
                      price = close
                      i += 1
                  d += datetime.timedelta(days=1)
              with (cache / f"{symbol}.NS.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.writer(handle)
                  writer.writerow(["Date", "Open", "High", "Low", "Close", "Volume"])
                  writer.writerows(rows)
          '@ | python -
          Copy-Item (Join-Path $cache "INFY.NS.csv") (Join-Path $cache "INDEX_NSEI.csv") -Force
          "SRE099_FIXTURE_ROOT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test legacy-data recommendations, budget and chart contracts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          if ($LASTEXITCODE -ne 0) { throw "Native validation command failed" }
          $engine = "$env:SRE_ENGINE_ROOT"
          $data = "$env:RUNNER_TEMP\sre099-appdata"
          $env:STOCK_MODERN_UI_PREVIEW = "0"
          $env:STOCK_REAL_DATA_REPO_ROOT = "$env:SRE099_FIXTURE_ROOT"

          $p = Start-Process -FilePath python -ArgumentList "`"$engine\run_modern_ui.py`" --no-browser --host 127.0.0.1 --port 18765 --repo-root `"$engine`" --app-data-dir `"$data`"" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 400
              if ($p.HasExited) { throw "0.9.9 backend exited early with code $($p.ExitCode)" }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "0.9.9 backend health check timed out" }
            if ($health.app_version -ne "0.9.12-phase3c-universe-visibility") { throw "Wrong app version: $($health.app_version)" }
            if ($health.preview_mode) { throw "Preview mode must be disabled in 0.9.3" }
            if ($health.data_source.mode -ne "REAL_FROZEN_HISTORY") { throw "Legacy real data mode not active: $($health.data_source.mode)" }
            if ([int]$health.data_source.active.stock_files -ne 6) { throw "Equity history count mismatch: $($health.data_source.active.stock_files)" }
            if ([int]$health.data_source.active.index_files -ne 1) { throw "Market index count mismatch: $($health.data_source.active.index_files)" }
            if ([int]$health.symbols -ne 6) { throw "Searchable equity symbol count must exclude INDEX_NSEI: $($health.symbols)" }

            $stock = Invoke-RestMethod "http://127.0.0.1:18765/api/stocks/INFY?limit=5000" -TimeoutSec 15
            if ($stock.bars.Count -lt 700) { throw "Legacy stock chart dataset smoke failed: $($stock.bars.Count)" }

            $runBody = @{capital=1000; horizon_sessions=20; target_return_percent=5} | ConvertTo-Json
            $run = Invoke-RestMethod "http://127.0.0.1:18765/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if ([int]$run.count -ne 6) { throw "Opportunity engine must analyze 6 equities and exclude INDEX_NSEI, got $($run.count)" }
            if (($run.items | Where-Object { $_.symbol -eq "INDEX_NSEI" }).Count -gt 0) { throw "Market index leaked into equity recommendations" }
            $exec = @($run.items | Where-Object { $_.executable -eq $true })
            if ($exec.Count -ne 1) { throw "Expected exactly one executable small-cap stock, got $($exec.Count)" }
            if (!$exec[0].single_stock_exception_applied) { throw "Opportunity row did not expose single-stock exception" }
            if ([int]$exec[0].executable_qty -lt 1) { throw "Executable quantity missing" }
            $runId = [string]$run.run.run_id
            if (!$runId) { throw "Opportunity run did not expose a Run ID" }
            $run2 = Invoke-RestMethod "http://127.0.0.1:18765/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if ([string]$run2.run.run_id -ne $runId) { throw "Identical inputs created a different Run ID" }
            if (!$run2.reused_run) { throw "Identical inputs were not marked as reused" }
            if (($run2.items | Where-Object { $_.target_status -notin @("MEETS TARGET","BELOW TARGET","NO TARGET") }).Count -gt 0) { throw "Invalid target status in Opportunities" }
            $runId | Set-Content "$env:RUNNER_TEMP\phase2-active-run.txt" -Encoding ASCII

            $planBody = @{deployable_capital=1000; horizon_sessions=20; target_return_percent=5} | ConvertTo-Json
            $plan = Invoke-RestMethod "http://127.0.0.1:18765/api/capital-plan" -Method Post -ContentType "application/json" -Body $planBody -TimeoutSec 60
            if ([double]$plan.capital_summary.deployable_capital -ne 1000) { throw "Budget was not preserved in capital plan" }
            if ($plan.new_buys.Count -ne 1) { throw "Capital Plan must contain exactly one executable buy for ₹1,000 fixture" }
            if (!$plan.new_buys[0].single_stock_exception_applied) { throw "Capital Plan did not apply single-stock exception" }
            if ([double]$plan.new_buys[0].estimated_cost -le 350) { throw "35% cap was not relaxed; spend stayed at/below ₹350" }
            if ([double]$plan.new_buys[0].estimated_cost -gt 1000) { throw "Capital Plan overspent ₹1,000" }
            if ([string]$plan.new_buys[0].symbol -ne [string]$exec[0].symbol) { throw "Opportunities Executable and Capital Plan disagree" }
            if (!$plan.source_run.market_session) { throw "Capital plan has no real market session" }
            if ([string]$plan.source_run.run_id -ne $runId) { throw "Capital Plan did not consume the same active Run ID" }
            if (!$plan.capital_summary.unused_cash_explanation) { throw "Capital Plan did not explain unused cash" }
            $dash = Invoke-RestMethod "http://127.0.0.1:18765/api/dashboard" -TimeoutSec 10
            if ([int]$dash.symbol_count -ne 6) { throw "Dashboard stock count must equal connected history count, got $($dash.symbol_count)" }
            if ([string]$dash.active_run.run_id -ne $runId) { throw "Dashboard is not bound to the active Run ID" }
            $stockActive = Invoke-RestMethod "http://127.0.0.1:18765/api/stocks/INFY?limit=5000" -TimeoutSec 15
            if ([string]$stockActive.active_run.run_id -ne $runId) { throw "Stock Intelligence is not bound to the active Run ID" }
            if ($stockActive.history.source_mode -ne "REAL_FROZEN_HISTORY") { throw "Stock history provenance mode missing" }
            if (!$stockActive.history.first_session -or !$stockActive.history.last_session) { throw "Stock history date range missing" }

            $source = Invoke-RestMethod "http://127.0.0.1:18765/api/data-source" -TimeoutSec 10
            if ($source.mode -ne "REAL_FROZEN_HISTORY") { throw "Legacy data source endpoint not active" }
            if (!$source.budget_uses_real_data) { throw "Budget is not marked as real-data driven" }
            if ($source.active.provenance -ne "LEGACY_FROZEN_OHLCV") { throw "Legacy provenance missing: $($source.active.provenance)" }
            if ($source.active.freshness_gate -ne "WARN") { throw "Frozen history must carry WARN freshness gate: $($source.active.freshness_gate)" }
            if ($source.active.freshness_status -ne "STALE_FROZEN") { throw "Frozen history freshness status mismatch: $($source.active.freshness_status)" }
            if ($source.active.analysis_data_current) { throw "Frozen history must never be marked current market data" }

            $js = (Invoke-WebRequest "http://127.0.0.1:18765/assets/app.js" -TimeoutSec 10).Content
            $html = (Invoke-WebRequest "http://127.0.0.1:18765/" -TimeoutSec 10).Content
            if ($js -notmatch 'minBars\s*=\s*8') { throw "8-candle minimum zoom contract missing" }
            if ($js -notmatch 'limit=5000') { throw "5000-session chart history contract missing" }
            if ($html -notmatch 'chartZoomIn' -or $html -notmatch 'chartZoomOut') { throw "Chart zoom buttons missing" }
            if ($html -notmatch 'drag to pan') { throw "Chart pan guidance missing" }
            if ($js -notmatch "startsWith\('REAL_'\)") { throw "Legacy real-data UI mode contract missing" }
            if ($js -notmatch 'MEETS TARGET' -or $js -notmatch 'BELOW TARGET') { throw "Target check labels missing" }
            if ($js -notmatch 'activeRunShort') { throw "Active Run ID rendering missing" }
            if ($js -notmatch 'capitalCashExplanation') { throw "Unused capital explanation UI missing" }
            if ($js -notmatch 'cash-affordable' -or $js -notmatch 'executable_qty') { throw "Opportunity execution UI contract missing" }
            if ($js -notmatch 'REAL FROZEN DATA') { throw "Frozen-data label missing" }

            Write-Host "0.9.9 PHASE-2 BACKEND CONTRACT PASS"
            Write-Host "Budget: $($plan.capital_summary.deployable_capital)"
            Write-Host "Market session: $($plan.source_run.market_session)"
            Write-Host "Chart bars: $($stock.bars.Count)"
            Write-Host "Candidates: $($run.count)"
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }


          $c.bundle.windows.nsis | Add-Member -NotePropertyName startMenuFolder -NotePropertyValue "Stock Recommendation Engine" -Force
          $c.bundle.windows.nsis | Add-Member -NotePropertyName compression -NotePropertyValue "lzma" -Force
          $c.bundle.targets = @("nsis")
          $c.bundle.resources = @{"../resources/SRE01413_ENGINE_SOURCE.zip"="resources/SRE01413_ENGINE_SOURCE.zip"}
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding UTF8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-desktop-0.9.1/src-tauri

      - name: Install Tauri CLI
        working-directory: native-desktop-0.9.1
        run: npm install --no-audit --no-fund

      - name: Build native Windows installer
        working-directory: native-desktop-0.9.1
        run: npm run tauri build

      - name: Authenticode sign installer when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\\src-tauri\\target\\release\\bundle\\nsis\\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Generated installer missing before signing" }
          $reportDir = $setup.Directory.FullName
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            "AUTHENTICODE_SIGNING=NOT_CONFIGURED" | Set-Content (Join-Path $reportDir "signing-status.txt") -Encoding UTF8
            Write-Host "Trusted Windows certificate is not configured; build remains unsigned."
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "sre-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw "signtool.exe not found" }
            $appExe = Get-ChildItem "native-desktop-0.9.1\\src-tauri\\target\\release\\*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "setup|uninstall|updater" } |
              Sort-Object Length -Descending | Select-Object -First 1
            if (!$appExe) { throw "Built application EXE not found before signing" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $appExe.FullName
            if ($LASTEXITCODE -ne 0) { throw "App EXE Authenticode signing failed: $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $appExe.FullName
            if ($LASTEXITCODE -ne 0) { throw "App EXE Authenticode verification failed: $LASTEXITCODE" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $LASTEXITCODE" }
            "AUTHENTICODE_SIGNING=SIGNED_AND_VERIFIED" | Set-Content (Join-Path $reportDir "signing-status.txt") -Encoding UTF8
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Windows Defender scan and release security report
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\\src-tauri\\target\\release\\bundle\\nsis\\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Generated installer missing before security scan" }
          $dir = $setup.Directory.FullName
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content (Join-Path $dir "installer.sha256") -Encoding ASCII

          $mp = $null
          $platform = Join-Path $env:ProgramData "Microsoft\\Windows Defender\\Platform"
          if (Test-Path $platform) {
            $mp = Get-ChildItem $platform -Recurse -Filter "MpCmdRun.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (!$mp) {
            $legacy = Join-Path $env:ProgramFiles "Windows Defender\\MpCmdRun.exe"
            if (Test-Path $legacy) { $mp = Get-Item $legacy }
          }

          $defenderStatus = "NOT_AVAILABLE_ON_RUNNER"
          if ($mp) {
            & $mp.FullName -Scan -ScanType 3 -File $setup.FullName -DisableRemediation
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "Windows Defender scan failed or detected a threat. Exit code: $code" }
            $defenderStatus = "PASS"
          }

          $sig = Get-AuthenticodeSignature $setup.FullName
          $fv = [Diagnostics.FileVersionInfo]::GetVersionInfo($setup.FullName)
          $signing = if (Test-Path (Join-Path $dir "signing-status.txt")) { (Get-Content (Join-Path $dir "signing-status.txt") -Raw).Trim() } else { "AUTHENTICODE_SIGNING=UNKNOWN" }
          @(
            "SRE_RELEASE_SECURITY_REPORT_V1",
            "VERSION=0.14.13-paper-trading-repair",
            "SHA256=$hash",
            "DEFENDER_SCAN=$defenderStatus",
            "SIGNATURE_STATUS=$($sig.Status)",
            "SIGNER_SUBJECT=$($sig.SignerCertificate.Subject)",
            $signing,
            "PRODUCT_NAME=$($fv.ProductName)",
            "FILE_VERSION=$($fv.FileVersion)",
            "INSTALL_MODE=currentUser",
            "ADMIN_REQUIRED=false-by-policy"
          ) | Set-Content (Join-Path $dir "release-security-report.txt") -Encoding UTF8

          Write-Host "SHA256: $hash"
          Write-Host "Defender: $defenderStatus"
          Write-Host "Signature: $($sig.Status)"

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "0.14.13 native Setup.exe missing" }
          Write-Host "SETUP: $($setup.FullName)"
          Write-Host "SIZE: $($setup.Length)"
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Stage pre-acceptance installer candidate
        shell: pwsh
        run: |
          $candidateDir = "$env:RUNNER_TEMP\sre01413-preacceptance"
          if (Test-Path $candidateDir) { Remove-Item $candidateDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Verified installer missing before pre-acceptance staging" }
          Copy-Item $setup.FullName (Join-Path $candidateDir "SRE-0.14.13-PREACCEPTANCE-CANDIDATE-Setup.exe") -Force

      - name: Upload pre-acceptance installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: SRE-0.14.13-PREACCEPTANCE-CANDIDATE
          path: ${{ runner.temp }}\sre01413-preacceptance\SRE-0.14.13-PREACCEPTANCE-CANDIDATE-Setup.exe
          retention-days: 1
          if-no-files-found: error

      - name: Install and launch generated Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Generated installer missing before installed-app test" }

          $installDir = "$env:RUNNER_TEMP\SRE01413Installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Write-Host "Silent installing: $($setup.FullName)"
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Silent installer failed: $($installer.ExitCode)" }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Stock Recommendation Engine" } |
            Select-Object -First 1

          $candidateDirs = @($installDir)
          if ($entry) {
            Write-Host "Registry install entry found:"
            $entry | Select-Object DisplayName,DisplayVersion,InstallLocation,UninstallString | Format-List
            if ($entry.InstallLocation) { $candidateDirs += $entry.InstallLocation }
            if ($entry.UninstallString) {
              $un = [Environment]::ExpandEnvironmentVariables($entry.UninstallString.Trim('"'))
              if (Test-Path $un) { $candidateDirs += (Split-Path $un -Parent) }
            }
          }

          $appExe = $null
          foreach ($dir in ($candidateDirs | Where-Object { $_ } | Select-Object -Unique)) {
            if (!(Test-Path $dir)) { continue }
            Write-Host "Inspecting install directory: $dir"
            Get-ChildItem $dir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  EXE: $($_.FullName)" }
            $appExe = Get-ChildItem $dir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch "uninstall|unins|setup|updater" -and
                ($_.Name -match "stock|recommendation|engine|sre" -or $_.Length -gt 1000000)
              } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if ($appExe) { break }
          }

          if (!$appExe) {
            $recent = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-10) -and $_.Name -notmatch "uninstall|unins|setup|updater" } |
              Sort-Object Length -Descending
            $recent | Select-Object -First 20 | ForEach-Object { Write-Host "Recent EXE: $($_.FullName)" }
            $appExe = $recent | Where-Object { $_.Name -match "stock|recommendation|engine|sre" } | Select-Object -First 1
          }

          if (!$appExe) { throw "Installed desktop EXE was not found after Setup.exe completed" }
          Write-Host "Installed EXE: $($appExe.FullName)"

          $appData = Join-Path $env:LOCALAPPDATA "StockRecommendationEngine"
          $ready = Join-Path $appData "runtime-ready.txt"
          $portFile = Join-Path $appData "runtime-port.txt"
          $logFile = Join-Path $appData "native-desktop-0.14.13.log"
          New-Item -ItemType Directory -Force -Path $appData | Out-Null
          @{
            run_id = "20261012T092526Z-2"
            target_return = 0.05
            target_explicit = $true
            target_origin = "USER_SUPPLIED"
            app_version = "0.12.1-phase6-target-hotfix"
            updated_at = "2026-10-12T09:25:26"
          } | ConvertTo-Json | Set-Content (Join-Path $appData "active_analysis_run.json") -Encoding UTF8
          @{
            schema = "SRE_CURRENT_UI_STATE_VERSION_V1"
            app_version = "0.12.1-phase6-target-hotfix"
          } | ConvertTo-Json | Set-Content (Join-Path $appData "current_ui_state_version.json") -Encoding UTF8
          Remove-Item $ready,$portFile -Force -ErrorAction SilentlyContinue

          # Upgrade-regression guard: simulate the stale engine folders/markers
          # left by prior installed releases. The new launcher MUST ignore them
          # and extract/run only native-engine-0.14.13.
          $legacy127 = Join-Path $appData "native-engine-0.12.7"
          New-Item -ItemType Directory -Force -Path $legacy127 | Out-Null
          "0.12.7-phase7-official-source-diagnostics-hotfix" | Set-Content (Join-Path $legacy127 ".sre0127-ready") -Encoding ASCII
          "raise SystemExit('STALE_0127_ENGINE_MUST_NOT_RUN')" | Set-Content (Join-Path $legacy127 "run_modern_ui.py") -Encoding ASCII

          $legacy130 = Join-Path $appData "native-engine-0.13.0"
          New-Item -ItemType Directory -Force -Path $legacy130 | Out-Null
          "0.13.0-phase8-validation" | Set-Content (Join-Path $legacy130 ".sre0130-ready") -Encoding ASCII
          "raise SystemExit('STALE_0130_ENGINE_MUST_NOT_RUN')" | Set-Content (Join-Path $legacy130 "run_modern_ui.py") -Encoding ASCII

          foreach ($oldVersion in @("0.12.7", "0.13.0", "0.13.1", "0.13.2", "0.13.3", "0.13.4", "0.13.5", "0.14.0", "0.14.1", "0.14.2", "0.14.3", "0.14.4", "0.14.5")) {
            $oldEngine = Join-Path $appData "native-engine-$oldVersion"
            New-Item -ItemType Directory -Force -Path $oldEngine | Out-Null
            "raise SystemExit('STALE_ENGINE_MUST_NOT_RUN')" | Set-Content (Join-Path $oldEngine "run_modern_ui.py") -Encoding ASCII
            $oldMarker = ".sre" + $oldVersion.Replace(".", "") + "-ready"
            "STALE" | Set-Content (Join-Path $oldEngine $oldMarker) -Encoding ASCII
          }
          # Mandatory same-semantic-version regression: the marker claims the
          # current version but carries Build A's stale content fingerprint.
          $sameVersionStale = Join-Path $appData "native-engine-0.14.13"
          New-Item -ItemType Directory -Force -Path $sameVersionStale | Out-Null
          @("version=0.14.13-paper-trading-repair", "bundle_sha256=BUILD_A_STALE_FINGERPRINT") | Set-Content (Join-Path $sameVersionStale ".sre01413-ready") -Encoding ASCII
          "raise SystemExit('SAME_VERSION_STALE_RUNTIME_MUST_NOT_RUN')" | Set-Content (Join-Path $sameVersionStale "run_modern_ui.py") -Encoding ASCII
          # Give the installed black-box test an official-data fixture whose
          # final bar is Friday 2025-11-28. A zero-executable production result
          # is valid and must not be overridden merely to exercise paper trading;
          # the lifecycle acceptance below seeds its own deterministic V2 order.
          $paperFixture = "$env:RUNNER_TEMP\sre01413-paper-official"
          $paperCache = Join-Path $paperFixture "data\normalized\nse_official\equity_bhavcopy\acceptance"
          New-Item -ItemType Directory -Force -Path $paperCache | Out-Null
          Copy-Item "$env:SRE099_FIXTURE_ROOT\stage2_2_1\data\frozen\*.csv" $paperCache -Force
          $env:STOCK_REAL_DATA_REPO_ROOT = $paperFixture
          $env:SRE_EXPECTED_SESSION_NOW = "2025-11-28T19:00:00+05:30"
          $desktop = Start-Process -FilePath $appExe.FullName -PassThru
          try {
            $alive = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if ($desktop.HasExited) {
                if (Test-Path $logFile) {
                  Write-Host "---- startup log ----"
                  Get-Content $logFile -Tail 200
                }
                throw "Installed desktop app exited during startup with code $($desktop.ExitCode)"
              }
              if (Test-Path $ready) { $alive = $true; break }
            }
            if (!$alive) {
              if (Test-Path $logFile) {
                Write-Host "---- startup log ----"
                Get-Content $logFile -Tail 200
              }
              throw "Installed desktop app never reached runtime-ready state"
            }

            $readyLines = Get-Content $ready
            if ($readyLines[0] -ne "0.14.13-paper-trading-repair") {
              throw "Installed desktop runtime version mismatch: $($readyLines[0])"
            }
            $newEngine = Join-Path $appData "native-engine-0.14.13"
            if (!(Test-Path (Join-Path $newEngine ".sre01413-ready"))) {
              throw "Installed app did not extract the versioned 0.14.13 engine/ready marker"
            }
            $expectedFingerprint = ((Get-Content "native-desktop-0.9.1\resources\SRE01413_ENGINE_SOURCE.sha256" -Raw).Trim() -split '\s+')[0]
            $markerFingerprint = ((Get-Content (Join-Path $newEngine ".sre01413-ready") | Where-Object { $_ -like 'bundle_sha256=*' }) -replace '^bundle_sha256=','').Trim()
            if ($markerFingerprint -ne $expectedFingerprint) { throw "Same-version stale runtime was not replaced: $markerFingerprint vs $expectedFingerprint" }
            if ($readyLines.Count -lt 3 -or $readyLines[2] -ne $expectedFingerprint) { throw "Runtime-ready fingerprint does not match packaged runtime" }
            if ((Get-Content (Join-Path $newEngine "run_modern_ui.py") -Raw) -match 'SAME_VERSION_STALE_RUNTIME_MUST_NOT_RUN') { throw "Build A stale runtime remained active" }
            if (!(Test-Path (Join-Path $newEngine "modern_ui\frontend\release-frontend-manifest.json")) -and !(Test-Path (Join-Path $newEngine "release-frontend-manifest.json"))) {
              throw "Installed 0.14.13 engine is missing the tested frontend manifest"
            }
            $port = [int]$readyLines[1]
            if ($port -le 0) { throw "Installed desktop runtime port invalid" }
            Write-Host "Installed app dynamic port: $port"

            $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 10
            if ($health.status -ne "ok") { throw "Installed app health status is not ok" }
            if ($health.app_version -ne "0.14.13-paper-trading-repair") {
              throw "Installed app backend version mismatch: $($health.app_version)"
            }

            $firstDash = Invoke-RestMethod "http://127.0.0.1:$port/api/dashboard" -TimeoutSec 10
            if ($null -ne $firstDash.active_run) { throw "First launch restored stale active run: $($firstDash.active_run.run_id)" }
            if ($firstDash.target_state.explicit -or $null -ne $firstDash.target_state.value) { throw "First launch restored stale target" }
            $firstOpps = Invoke-RestMethod "http://127.0.0.1:$port/api/opportunities" -TimeoutSec 10
            if ($null -ne $firstOpps.run) { throw "First launch opportunities restored stale active run: $($firstOpps.run.run_id)" }
            if ($firstOpps.target_state.explicit) { throw "First launch opportunities restored stale target" }
            foreach ($item in @($firstOpps.items)) {
              if ($item.target_status -eq "MEETS TARGET" -or $item.target_status -eq "BELOW TARGET") {
                throw "First launch emitted target comparison without current-version explicit target"
              }
            }
            $stateMarker = Get-Content (Join-Path $appData "current_ui_state_version.json") -Raw | ConvertFrom-Json
            if ($stateMarker.app_version -ne "0.14.13-paper-trading-repair") { throw "Current UI state version marker was not upgraded" }

            $source = Invoke-RestMethod "http://127.0.0.1:$port/api/data-source" -TimeoutSec 10
            if ($source.mode -ne "REAL_OFFICIAL_DATA") {
              throw "Installed app did not connect to real fixture data: $($source.mode)"
            }
            if ([int]$source.active.stock_files -ne 6) { throw "Installed app equity count mismatch: $($source.active.stock_files)" }
            if ([int]$source.active.index_files -ne 1) { throw "Installed app index count mismatch: $($source.active.index_files)" }
            if ($source.active.provenance -ne "OFFICIAL_NSE_OHLCV") {
              throw "Installed app official provenance mismatch: $($source.active.provenance)"
            }

            $body = @{path="$paperFixture"} | ConvertTo-Json
            $connected = Invoke-RestMethod "http://127.0.0.1:$port/api/data-source" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 15
            if ($connected.mode -ne "REAL_OFFICIAL_DATA") {
              throw "Installed app POST /api/data-source failed"
            }

            $runBody = @{capital=1000; horizon_sessions=20; target_return_percent=5} | ConvertTo-Json
            $run = Invoke-RestMethod "http://127.0.0.1:$port/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if (!$run.target_state.explicit) { throw "Installed Phase 6 explicit target was lost" }
            if ([math]::Abs([double]$run.target_state.value - 0.05) -gt 0.000001) { throw "Installed target value mismatch" }
            if ([int]$run.count -ne 6) { throw "Installed app must analyze 6 equities, got $($run.count)" }
            if (($run.items | Where-Object { $_.symbol -eq "INDEX_NSEI" }).Count -gt 0) { throw "Installed app analyzed INDEX_NSEI as equity" }
            $installedExec = @($run.items | Where-Object { $_.executable -eq $true })
            if ($installedExec.Count -eq 0) {
              Write-Host "VALID PRODUCTION NO-TRADE OUTCOME: installed engine emitted zero executable recommendations"
            } else {
              Write-Host "Installed production executable recommendations: $($installedExec.Count)"
              foreach ($item in $installedExec) {
                if ([int]$item.executable_qty -lt 1) { throw "Executable production recommendation lacks positive quantity: $($item.symbol)" }
              }
            }
            $installedRunId = [string]$run.run.run_id
            if (!$installedRunId) { throw "Installed opportunity run did not return a Run ID" }
            $runAgain = Invoke-RestMethod "http://127.0.0.1:$port/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if ([string]$runAgain.run.run_id -ne $installedRunId -or !$runAgain.reused_run) { throw "Installed app identical inputs did not reuse Run ID" }

            $planBody = @{deployable_capital=1000; horizon_sessions=20; target_return_percent=5} | ConvertTo-Json
            $plan = Invoke-RestMethod "http://127.0.0.1:$port/api/capital-plan" -Method Post -ContentType "application/json" -Body $planBody -TimeoutSec 60
            if ([double]$plan.capital_summary.deployable_capital -ne 1000) { throw "Installed app Capital Plan lost the ₹1,000 budget" }
            if (!$plan.capital_summary.desired_return_is_minimum_threshold) { throw "Installed app did not enforce desired return as a minimum threshold" }
            if ([double]$plan.capital_summary.estimated_spend -gt 1000.001) { throw "Installed Capital Plan overspent the ₹1,000 budget" }
            if ([double]$plan.capital_summary.remaining_cash -lt -0.001) { throw "Installed Capital Plan produced negative cash" }
            if ([string]$plan.source_run.run_id -ne $installedRunId) { throw "Installed Capital Plan used a different Run ID" }
            if (!$plan.capital_summary.unused_cash_explanation) { throw "Installed Capital Plan lacks unused-cash explanation" }
            foreach ($buy in @($plan.new_buys)) {
              if ([double]$buy.estimated_cost -le 0) { throw "Installed Capital Plan emitted a zero-cost buy" }
            }
            $paperStart = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio/start?starting_capital=100000" -Method Post -TimeoutSec 30
            if (!$paperStart.active -or [double]$paperStart.starting_capital -ne 100000) { throw "Installed PAPER_TRADING_V2 did not initialize exactly once" }
            $paperId = [string]$paperStart.portfolio_id

            # Recommendation generation and paper lifecycle are separate concerns.
            # Zero executable production recommendations is a valid no-trade day.
            # Seed exactly one deterministic PENDING_NEXT_OPEN order through the
            # packaged V2 module, against the same installed DB. From this point
            # onward all progression is exercised only through installed APIs.
            $seedResultPath = "$env:RUNNER_TEMP\installed-paper-seed-result.json"
            $env:SRE_ACCEPTANCE_ENGINE = $newEngine
            $env:SRE_ACCEPTANCE_DB = (Join-Path $appData "phase81_validation.sqlite3")
            $env:SRE_ACCEPTANCE_PORTFOLIO_ID = $paperId
            $env:SRE_ACCEPTANCE_RUN_ID = $installedRunId
            $env:SRE_ACCEPTANCE_SEED_RESULT = $seedResultPath
          @'
          import json
          import os
          import sys
          from pathlib import Path

          engine = Path(os.environ["SRE_ACCEPTANCE_ENGINE"])
          sys.path.insert(0, str(engine))
          from stock_app.validation_v2 import ExecutionAssumptions, process_paper_session

          session = "2025-11-28"
          candidate = {
              "symbol": "INFY",
              "market_session": session,
              "live_decision": {
                  "final_action": "RECOVERY BUY",
                  "executable": True,
                  "strategy_style": "RECOVERY",
                  "confidence": "HIGH",
                  "recovery_thesis": "CI installed-lifecycle acceptance order",
                  "invalidation": "CI acceptance only",
                  "evidence": {"source": "INSTALLED_LIFECYCLE_ACCEPTANCE", "session": session},
              },
          }
          result = process_paper_session(
              Path(os.environ["SRE_ACCEPTANCE_DB"]),
              portfolio_id=os.environ["SRE_ACCEPTANCE_PORTFOLIO_ID"],
              expected_session=session,
              latest_official_session=session,
              official_freshness="PASS",
              production_session=session,
              production_run_id=os.environ["SRE_ACCEPTANCE_RUN_ID"],
              app_version="0.14.13-paper-trading-repair",
              production_model_version="LIVE_DECISION_V1",
              evidence_pipeline_version="0.14.13-paper-trading-repair",
              candidates=[candidate],
              allocation_plan={"new_buys": [{"symbol": "INFY", "estimated_cost": 10000.0}]},
              official_opens={},
              official_closes={},
              available_sessions=[session],
              official_opens_by_session={},
              monitoring={},
              assumptions=ExecutionAssumptions(),
          )
          if len(result.get("new_orders") or []) != 1:
              raise RuntimeError(f"CI lifecycle seed did not create exactly one pending order: {result}")
          Path(os.environ["SRE_ACCEPTANCE_SEED_RESULT"]).write_text(
              json.dumps(result, sort_keys=True),
              encoding="utf-8",
          )
          print("INSTALLED PACKAGED V2 DETERMINISTIC PENDING SEED PASS")
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw "Unable to seed deterministic installed PAPER_TRADING_V2 pending order" }

            $seedObservation = Get-Content $seedResultPath -Raw | ConvertFrom-Json
            if (@($seedObservation.event_chain).Count -lt 8) { throw "Packaged V2 seed did not expose the ordered event trail" }

            $paperAfter = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio" -TimeoutSec 30
            if ([string]$paperAfter.portfolio_id -ne $paperId) { throw "V2 lifecycle seed changed the authoritative paper portfolio" }
            if (@($paperAfter.positions).Count -ne 0) { throw "Session-T acceptance order was illegally filled on Session T" }
            if (@($paperAfter.pending_orders).Count -ne 1 -or [string]$paperAfter.pending_orders[0].state -ne "PENDING_NEXT_OPEN") { throw "Packaged V2 seed did not persist the Session-T pending order" }
            if ([string]$paperAfter.pending_orders[0].symbol -ne "INFY") { throw "Packaged V2 seed created an unexpected symbol" }
            if (@($paperAfter.journal | Where-Object { $_.event_type -eq 'BUY SIGNAL' }).Count -ne 1) { throw "Packaged V2 seed did not persist exactly one order-creation event" }

            $beforeDuplicate = @{
              portfolio_id = [string]$paperAfter.portfolio_id
              cash = [double]$paperAfter.cash
              positions = @($paperAfter.positions).Count
              pending_orders = @($paperAfter.pending_orders).Count
              journal = @($paperAfter.journal).Count
              snapshots = @($paperAfter.nav_history).Count
              fills = @($paperAfter.fills).Count
            }
            $duplicatePaper = Invoke-RestMethod "http://127.0.0.1:$port/api/post-close-daily-flow" -Method Post -TimeoutSec 120
            $paperDuplicateState = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio" -TimeoutSec 30
            if ([string]$paperDuplicateState.portfolio_id -ne $paperId -or [double]$paperDuplicateState.cash -ne $beforeDuplicate.cash) { throw "Duplicate daily flow changed portfolio identity or cash" }
            if (@($paperDuplicateState.positions).Count -ne $beforeDuplicate.positions -or @($paperDuplicateState.pending_orders).Count -ne $beforeDuplicate.pending_orders -or @($paperDuplicateState.journal).Count -ne $beforeDuplicate.journal -or @($paperDuplicateState.nav_history).Count -ne $beforeDuplicate.snapshots) { throw "Duplicate daily flow duplicated a decision, order, fill, or snapshot" }
            $beforeDuplicate | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\installed-paper-state.json" -Encoding UTF8
            $dash = Invoke-RestMethod "http://127.0.0.1:$port/api/dashboard" -TimeoutSec 10
            if ([int]$dash.symbol_count -ne 6) { throw "Installed Dashboard stock count mismatch: $($dash.symbol_count)" }
            if ([string]$dash.active_run.run_id -ne $installedRunId) { throw "Installed Dashboard active Run ID mismatch" }
            $stockPhase = Invoke-RestMethod "http://127.0.0.1:$port/api/stocks/INFY?limit=5000" -TimeoutSec 30
            if ([string]$stockPhase.active_run.run_id -ne $installedRunId) { throw "Installed Stock Intelligence active Run ID mismatch" }
            if ($stockPhase.technical_v2.schema -ne "SRE_TECHNICAL_INTELLIGENCE_V2") { throw "Installed app Technical V2 schema missing" }
            if ($stockPhase.technical_v2.authority -ne "LIVE_EVIDENCE") { throw "Installed app Technical V2 authority changed" }
            if ($null -eq $stockPhase.technical_v2.technical_score) { throw "Installed app Technical V2 score missing" }
            if ($stockPhase.fundamental_v3.schema -ne "SRE_FUNDAMENTAL_INTELLIGENCE_V3") { throw "Installed app Fundamental V3 schema missing" }
            if ($stockPhase.fundamental_v3.authority -ne "LIVE_EVIDENCE") { throw "Installed app Fundamental V3 authority changed" }
            if ($stockPhase.fundamental_v3.promotion_allowed) { throw "Installed app Fundamental V3 promoted unexpectedly" }
            if ($stockPhase.combined_v2.schema -ne "SRE_COMBINED_PREDICTION_V2") { throw "Installed app Combined V2 schema missing" }
            if ($stockPhase.combined_v2.authority -ne "DIAGNOSTIC_ONLY" -or $stockPhase.combined_v2.promotion_allowed) { throw "Installed app Combined V2 authority violation" }
            if ($stockPhase.combined_v2.target_used_in_score) { throw "Installed app target leaked into Combined V2" }
            $installedRunId | Set-Content "$env:RUNNER_TEMP\installed-phase2-run.txt" -Encoding ASCII

            $root = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 10
            if ($root.StatusCode -ne 200) { throw "Installed app UI root did not return HTTP 200" }
            if ($root.Content -notmatch "Stock Recommendation Engine") {
              throw "Installed app UI root is not the expected workspace"
            }

            Write-Host "INSTALLED APP END-TO-END PASS"
            Write-Host "Version: $($health.app_version)"
            Write-Host "Mode: $($source.mode)"
            Write-Host "Stocks: $($source.active.stock_files)"
            Write-Host "Port: $port"
          }
          finally {
            if (!$desktop.HasExited) {
              Start-Process -FilePath "taskkill.exe" -ArgumentList @("/PID",$desktop.Id,"/T","/F") -Wait -NoNewWindow | Out-Null
            }
          }

      - name: Reopen installed app and verify persistent Run ID
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appExe = Get-ChildItem "$env:RUNNER_TEMP\SRE01413Installed" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "uninstall|unins|setup|updater" } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (!$appExe) { throw "Installed 0.14.13 desktop EXE missing for restart test" }
          $expected = (Get-Content "$env:RUNNER_TEMP\installed-phase2-run.txt" -Raw).Trim()
          $appData = Join-Path $env:LOCALAPPDATA "StockRecommendationEngine"
          $ready = Join-Path $appData "runtime-ready.txt"
          $portFile = Join-Path $appData "runtime-port.txt"
          $paperFixture = "$env:RUNNER_TEMP\sre01413-paper-official"
          $paperCache = Join-Path $paperFixture "data\normalized\nse_official\equity_bhavcopy\acceptance"
          $env:SRE_PAPER_ACCEPTANCE_CACHE = $paperCache
          @'
          from pathlib import Path
          import csv, os

          cache = Path(os.environ["SRE_PAPER_ACCEPTANCE_CACHE"])
          for path in sorted(cache.glob("*.csv")):
              with path.open("r", newline="", encoding="utf-8-sig") as handle:
                  rows = list(csv.reader(handle))
              if len(rows) < 2:
                  raise RuntimeError(f"No market rows in {path}")
              if rows[-1][0] != "2025-11-28":
                  raise RuntimeError(f"Unexpected Session-T tail in {path}: {rows[-1][0]}")
              next_row = list(rows[-1])
              next_row[0] = "2025-12-01"
              with path.open("a", newline="", encoding="utf-8") as handle:
                  csv.writer(handle).writerow(next_row)
          print("Official Session T+1 fixture appended")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Unable to advance installed official fixture to Session T+1" }
          Remove-Item $ready,$portFile -Force -ErrorAction SilentlyContinue
          $env:STOCK_REAL_DATA_REPO_ROOT = $paperFixture
          $env:SRE_EXPECTED_SESSION_NOW = "2025-12-01T19:00:00+05:30"
          $desktop = Start-Process -FilePath $appExe.FullName -PassThru
          try {
            $alive=$false
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if($desktop.HasExited){throw "Reopened installed app exited early"}
              if(Test-Path $ready){$alive=$true;break}
            }
            if(!$alive){throw "Reopened installed app never reached runtime-ready"}
            $readyLines=Get-Content $ready
            if($readyLines[0] -ne "0.14.13-paper-trading-repair"){throw "Reopened runtime version mismatch: $($readyLines[0])"}
            $port=[int]$readyLines[1]
            $dash=Invoke-RestMethod "http://127.0.0.1:$port/api/dashboard" -TimeoutSec 10
            if([string]$dash.active_run.run_id -ne $expected){throw "Installed app changed active Run ID after close/reopen"}
            if(!$dash.target_state.explicit -or !$dash.target_state.restored){throw "Installed app did not label explicit target as restored after restart"}
            $opps=Invoke-RestMethod "http://127.0.0.1:$port/api/opportunities" -TimeoutSec 10
            if([string]$opps.run.run_id -ne $expected){throw "Opportunities changed Run ID after close/reopen"}
            $expectedPaper = Get-Content "$env:RUNNER_TEMP\installed-paper-state.json" -Raw | ConvertFrom-Json
            $paper = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio" -TimeoutSec 30
            if([string]$paper.portfolio_id -ne [string]$expectedPaper.portfolio_id){throw "Paper portfolio ID changed after restart"}
            if([double]$paper.cash -ne [double]$expectedPaper.cash -or @($paper.positions).Count -ne [int]$expectedPaper.positions -or @($paper.pending_orders).Count -ne [int]$expectedPaper.pending_orders -or @($paper.journal).Count -ne [int]$expectedPaper.journal -or @($paper.nav_history).Count -ne [int]$expectedPaper.snapshots){throw "Paper portfolio state changed across restart"}
            if(@($paper.pending_orders).Count -ne 1){throw "Pending order was not restored before Session T+1 processing"}

            $nextSession = Invoke-RestMethod "http://127.0.0.1:$port/api/post-close-daily-flow" -Method Post -TimeoutSec 180
            $filled = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio" -TimeoutSec 30
            if([string]$filled.portfolio_id -ne [string]$expectedPaper.portfolio_id){throw "Session T+1 changed paper portfolio identity"}
            if(@($filled.pending_orders).Count -ne 0){throw "Session T+1 left an eligible order pending"}
            if(@($filled.positions | Where-Object { $_.state -ne 'CLOSED' }).Count -ne 1){throw "Session T+1 did not create exactly one open position"}
            if(@($filled.fills).Count -ne 1){throw "Session T+1 did not persist exactly one fill"}
            if([string]$filled.fills[0].fill_session -ne "2025-12-01"){throw "Fill did not use the next eligible NSE session"}
            if([double]$filled.cash -ge [double]$expectedPaper.cash){throw "BUY fill did not deduct cash"}
            $nextObservation = if ($nextSession.paper_portfolio_observation) { $nextSession.paper_portfolio_observation } else { $nextSession.paper_portfolio_v2_observation }
            if(@($nextObservation.event_chain | Where-Object { $_ -eq 'ORDER_EXECUTED' }).Count -ne 1){throw "Production daily-flow response did not report ORDER_EXECUTED"}
            $fillCount = @($filled.fills).Count
            $positionCount = @($filled.positions).Count
            $cashAfterFill = [double]$filled.cash
            $journalAfterFill = @($filled.journal).Count
            $snapshotsAfterFill = @($filled.nav_history).Count

            $duplicateNext = Invoke-RestMethod "http://127.0.0.1:$port/api/post-close-daily-flow" -Method Post -TimeoutSec 180
            $afterDuplicateNext = Invoke-RestMethod "http://127.0.0.1:$port/api/validation/paper-portfolio" -TimeoutSec 30
            if(@($afterDuplicateNext.fills).Count -ne $fillCount -or @($afterDuplicateNext.positions).Count -ne $positionCount -or [double]$afterDuplicateNext.cash -ne $cashAfterFill -or @($afterDuplicateNext.journal).Count -ne $journalAfterFill -or @($afterDuplicateNext.nav_history).Count -ne $snapshotsAfterFill){throw "Duplicate Session T+1 flow duplicated a fill, position, event, snapshot, or cash mutation"}
            @{
              portfolio_id = [string]$filled.portfolio_id
              cash = $cashAfterFill
              positions = $positionCount
              pending_orders = @($filled.pending_orders).Count
              fills = $fillCount
              journal = $journalAfterFill
              snapshots = $snapshotsAfterFill
            } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\installed-paper-filled-state.json" -Encoding UTF8
            Write-Host "INSTALLED APP RESTART -> NEXT SESSION -> EXACTLY-ONCE FILL PASS"
          } finally {
            if(!$desktop.HasExited){Start-Process -FilePath "taskkill.exe" -ArgumentList @("/PID",$desktop.Id,"/T","/F") -Wait -NoNewWindow | Out-Null}
          }


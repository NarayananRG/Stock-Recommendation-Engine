name: Gate C bounded GUI recovery synthetic portability
on:
  push:
    branches: [audit/gatec-fingerprint-rootcause-20261023]
    paths: [.github/workflows/gatec-fingerprint-recovery.yml, tools/gatec-fingerprint/**]
  workflow_dispatch:
jobs:
  portability:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Stdlib synthetic GUI API integration and preservation guards
        run: python tools/gatec-fingerprint/test_recovery.py
      - name: PowerShell parse
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/gatec-fingerprint/RECOVER_GUI_CURRENT_REPLAYS.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

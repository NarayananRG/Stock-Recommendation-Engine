name: Build SRE 0.9.2 Functional Parity

on:
  push:
    branches: [ui-0.9.2-functional-parity]
    paths:
      - ".ci/native092/**"
      - ".github/workflows/build-native-desktop-092.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sre-native-092
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Decode verified native desktop shell
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".ci\native091\source.part.*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 native shell chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if ($b64.Length -ne 39284) { throw "Native shell base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\native-desktop-shell.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "86dd430e933d044d08ae4637787eff52369b46b7ee1013e48af7851d9ea88fcc") { throw "Native shell hash mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath "." -Force

          Copy-Item ".ci\native091\main_system_python.rs" "native-desktop-0.9.1\src-tauri\src\main.rs" -Force
          Copy-Item ".ci\native091\Cargo.toml" "native-desktop-0.9.1\src-tauri\Cargo.toml" -Force

          $main = "native-desktop-0.9.1\src-tauri\src\main.rs"
          $m = Get-Content $main -Raw
          $m = $m.Replace("0.9.1-native-desktop","0.9.2-functional-parity-phase1")
          $m = $m.Replace("engine-v091","engine-v092")
          $m = $m.Replace(".sre091-ready",".sre092-ready")
          $m = $m.Replace("SRE091_ENGINE_SOURCE.zip","SRE092_ENGINE_SOURCE.zip")
          $m = $m.Replace("native-desktop-0.9.1.log","native-desktop-0.9.2.log")
          Set-Content $main $m -Encoding UTF8

          $cargo = "native-desktop-0.9.1\src-tauri\Cargo.toml"
          (Get-Content $cargo -Raw).Replace('version = "0.9.1"','version = "0.9.2"') | Set-Content $cargo -Encoding UTF8

          $pkg = "native-desktop-0.9.1\package.json"
          $j = Get-Content $pkg -Raw | ConvertFrom-Json
          $j.version = "0.9.2"
          $j | ConvertTo-Json -Depth 20 | Set-Content $pkg -Encoding UTF8

      - name: Reconstruct canonical engine and apply 0.9.2 parity overlay
        shell: pwsh
        run: |
          $dir = "stock-engine-ultra-ui-0.8.5-source-with-windows-builder"
          $parts = Get-ChildItem -Path $dir -Filter "source.part.*.b64" | Sort-Object Name
          if (!$parts) { throw "Canonical 0.8.5 source parts missing" }
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = "$env:RUNNER_TEMP\sre085.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "915425e7027fd6145298e3e467b678e6f5998a895d85c4c18a9cfec033df7edc") { throw "Canonical source hash mismatch: $hash" }

          $extract = "$env:RUNNER_TEMP\engine-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $engine = Join-Path $extract "StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE"
          if (!(Test-Path "$engine\requirements-v1.txt")) { throw "Canonical engine root missing" }

          $overlayParts = Get-ChildItem ".ci\native092\overlay.part.*.b64" | Sort-Object Name
          if ($overlayParts.Count -ne 7) { throw "Expected 7 parity overlay chunks, found $($overlayParts.Count)" }
          $overlayB64 = ($overlayParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if ($overlayB64.Length -ne 42016) { throw "Parity overlay base64 length mismatch: $($overlayB64.Length)" }
          $overlayZip = "$env:RUNNER_TEMP\sre092-overlay.zip"
          [IO.File]::WriteAllBytes($overlayZip, [Convert]::FromBase64String($overlayB64))
          $overlayHash = (Get-FileHash $overlayZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlayHash -ne "ed91eb0ec54c562f2965a730174bbf422c4ae2ba6852f9e046305593cf96d1d8") { throw "Parity overlay hash mismatch: $overlayHash" }
          Expand-Archive -LiteralPath $overlayZip -DestinationPath $engine -Force
          if (!(Test-Path "$engine\modern_ui\api.py")) { throw "0.9.2 engine overlay failed" }
          "SRE_ENGINE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test 0.9.2 parity backend
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          $engine = "$env:SRE_ENGINE_ROOT"
          $data = "$env:RUNNER_TEMP\sre092-appdata"
          $env:STOCK_MODERN_UI_PREVIEW = "1"
          $p = Start-Process -FilePath python -ArgumentList "`"$engine\run_modern_ui.py`" --no-browser --host 127.0.0.1 --port 18765 --repo-root `"$engine`" --app-data-dir `"$data`"" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i=0; $i -lt 50; $i++) {
              Start-Sleep -Milliseconds 400
              if ($p.HasExited) { throw "0.9.2 backend exited early with code $($p.ExitCode)" }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "0.9.2 backend health check timed out" }
            if ($health.app_version -ne "0.9.2-functional-parity-phase1") { throw "Wrong app version: $($health.app_version)" }

            $stock = Invoke-RestMethod "http://127.0.0.1:18765/api/stocks/INFY?limit=1300" -TimeoutSec 10
            if ($stock.bars.Count -lt 200) { throw "Stock chart dataset smoke failed" }

            $portfolio = Invoke-RestMethod "http://127.0.0.1:18765/api/portfolio" -TimeoutSec 10
            $today = Invoke-RestMethod "http://127.0.0.1:18765/api/today" -TimeoutSec 10
            $history = Invoke-RestMethod "http://127.0.0.1:18765/api/history" -TimeoutSec 10
            $glossary = Invoke-RestMethod "http://127.0.0.1:18765/api/glossary?q=chart" -TimeoutSec 10
            $system = Invoke-RestMethod "http://127.0.0.1:18765/api/system" -TimeoutSec 15
            if ($null -eq $portfolio.summary) { throw "Portfolio parity endpoint failed" }
            if ($null -eq $today) { throw "Today parity endpoint failed" }
            if ($null -eq $history) { throw "History parity endpoint failed" }
            if ($glossary.items.Count -lt 1) { throw "Glossary parity endpoint failed" }
            if ($null -eq $system) { throw "System parity endpoint failed" }

            $body = @{symbol="INFY"; quantity=2; buy_price=1500; buy_date="2026-10-10"} | ConvertTo-Json
            $added = Invoke-RestMethod "http://127.0.0.1:18765/api/portfolio" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 10
            if (!$added.position_id) { throw "Portfolio add failed" }
            Invoke-RestMethod "http://127.0.0.1:18765/api/portfolio/$($added.position_id)" -Method Delete -TimeoutSec 10 | Out-Null

            Write-Host "0.9.2 PARITY BACKEND PASS - $($stock.bars.Count) chart bars"
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Package native application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "native-desktop-0.9.1\resources" | Out-Null
          Compress-Archive -Path "$env:SRE_ENGINE_ROOT\*" -DestinationPath "native-desktop-0.9.1\resources\SRE092_ENGINE_SOURCE.zip" -Force

          New-Item -ItemType Directory -Force -Path "native-desktop-0.9.1\src-tauri\icons" | Out-Null
          python -c "import struct,pathlib; w=h=32; px=bytes([52,211,153,255])*(w*h); mask=bytes(128); dib=struct.pack('<IIIHHIIIIII',40,w,h*2,1,32,0,len(px),0,0,0,0)+px+mask; ico=struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',w,h,0,0,1,32,len(dib),22)+dib; pathlib.Path(r'native-desktop-0.9.1\src-tauri\icons\icon.ico').write_bytes(ico)"

          $p = "native-desktop-0.9.1\src-tauri\tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.version = "0.9.2"
          $c.productName = "Stock Recommendation Engine"
          $c.bundle.targets = @("nsis")
          $c.bundle.resources = @{"../resources/SRE092_ENGINE_SOURCE.zip"="resources/SRE092_ENGINE_SOURCE.zip"}
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding UTF8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-desktop-0.9.1/src-tauri

      - name: Install Tauri CLI
        working-directory: native-desktop-0.9.1
        run: npm install --no-audit --no-fund

      - name: Build native Windows installer
        working-directory: native-desktop-0.9.1
        run: npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "0.9.2 native Setup.exe missing" }
          Write-Host "SETUP: $($setup.FullName)"
          Write-Host "SIZE: $($setup.Length)"
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Upload 0.9.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: SRE-0.9.2-Functional-Parity-Setup
          path: native-desktop-0.9.1/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

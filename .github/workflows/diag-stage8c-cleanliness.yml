name: Validate Stage 8C Cleanliness Guard

on:
  push:
    branches: [diag-stage8c-cleanliness-20261016]
    paths:
      - ".github/workflows/diag-stage8c-cleanliness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated_results_cleanup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove generated Stage 5D results are the only allowed cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Add-Content "Stage 5D/results/stage5d3_schema.json" ""
          Set-Content "Stage 5D/results/ci-untracked-result.txt" "generated"

          $dirty = @(git status --porcelain --untracked-files=all -- "Stage 5D")
          if ($dirty.Count -lt 2) { throw "Fixture did not create expected Stage 5D result dirtiness" }

          $unexpected=@()
          foreach($line in $dirty){
            if([string]::IsNullOrWhiteSpace($line)){continue}
            $pathText=if($line.Length -gt 3){$line.Substring(3)}else{""}
            $paths=@($pathText)
            if($pathText -match ' -> '){$paths=@($pathText -split ' -> ')}
            foreach($p in $paths){
              $n=$p.Trim('"').Replace('\','/')
              if($n -notlike "Stage 5D/results/*"){$unexpected+=$line;break}
            }
          }
          if($unexpected.Count -gt 0){throw "Generated-results fixture was incorrectly classified as protected drift"}

          git restore --source=HEAD --worktree -- "Stage 5D/results"
          if($LASTEXITCODE -ne 0){throw "restore failed"}
          git clean -fd -- "Stage 5D/results"
          if($LASTEXITCODE -ne 0){throw "clean failed"}

          $after=@(git status --porcelain --untracked-files=all -- "Stage 5D")
          if($after.Count -ne 0){$after|%{Write-Host $_};throw "Stage 5D not clean after results-only cleanup"}
          Write-Host "GENERATED RESULTS CLEANUP PASS"

  protected_source_rejected:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove protected Stage 5D source drift is not hidden
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Add-Content "Stage 5D/stage5d/allocator.py" "# CI protected drift fixture"

          $dirty=@(git status --porcelain --untracked-files=all -- "Stage 5D")
          $unexpected=@()
          foreach($line in $dirty){
            if([string]::IsNullOrWhiteSpace($line)){continue}
            $pathText=if($line.Length -gt 3){$line.Substring(3)}else{""}
            $paths=@($pathText)
            if($pathText -match ' -> '){$paths=@($pathText -split ' -> ')}
            foreach($p in $paths){
              $n=$p.Trim('"').Replace('\','/')
              if($n -notlike "Stage 5D/results/*"){$unexpected+=$line;break}
            }
          }
          if($unexpected.Count -eq 0){throw "Protected Stage 5D source drift was not detected"}
          Write-Host "PROTECTED SOURCE REJECTION PASS"
          $unexpected | % { Write-Host $_ }

  stage8c_after_cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stage 8C dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pandas numpy tzdata
          if($LASTEXITCODE -ne 0){throw "dependency install failed"}
      - name: Simulate serial Stage 5D result mutation, clean it, then run 8C
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"

          if(!(Test-Path "_git")){
            New-Item -ItemType Junction -Path "_git" -Target (Resolve-Path ".git").Path | Out-Null
          }

          Add-Content "Stage 5D/results/stage5d3_schema.json" ""
          Set-Content "Stage 5D/results/ci-untracked-result.txt" "generated"

          $dirty=@(git status --porcelain --untracked-files=all -- "Stage 5D")
          $unexpected=@()
          foreach($line in $dirty){
            if([string]::IsNullOrWhiteSpace($line)){continue}
            $pathText=if($line.Length -gt 3){$line.Substring(3)}else{""}
            $paths=@($pathText)
            if($pathText -match ' -> '){$paths=@($pathText -split ' -> ')}
            foreach($p in $paths){
              $n=$p.Trim('"').Replace('\','/')
              if($n -notlike "Stage 5D/results/*"){$unexpected+=$line;break}
            }
          }
          if($unexpected.Count -gt 0){$unexpected|%{Write-Host $_};throw "Unexpected protected Stage 5D drift"}

          git restore --source=HEAD --worktree -- "Stage 5D/results"
          if($LASTEXITCODE -ne 0){throw "restore failed"}
          git clean -fd -- "Stage 5D/results"
          if($LASTEXITCODE -ne 0){throw "clean failed"}

          $after=@(git status --porcelain --untracked-files=all -- "Stage 5D")
          if($after.Count -ne 0){$after|%{Write-Host $_};throw "Stage 5D remains dirty"}

          python "Stage 6\tests\run_stage6_8c_tests.py"
          if($LASTEXITCODE -ne 0){throw "Stage 6.8C failed after guarded cleanup"}
          Write-Host "STAGE 8C AFTER GUARDED CLEANUP PASS"

name: Diagnose Stage 6.4B Windows

on:
  push:
    branches: [fix-paper-trading-root-causes-20261016]
    paths:
      - ".github/workflows/diagnose-stage64b-windows.yml"
      - ".gitattributes"
      - "Stage 6/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage64b:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Configure byte-stable LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify market-context raw blob identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "Stage 6/contracts/market_context.schema.json"
          $tracked = (git rev-parse "HEAD:$path").Trim()
          $raw = (git hash-object --no-filters -- "$path").Trim()
          Write-Host "TRACKED=$tracked RAW=$raw"
          if ($raw -ne $tracked) { throw "market_context.schema.json raw bytes differ from tracked blob" }

      - name: Run Stage 6.4B only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python "Stage 6\tests\run_stage6_4b_tests.py"
          if ($LASTEXITCODE -ne 0) { throw "Stage 6.4B diagnostic failed" }

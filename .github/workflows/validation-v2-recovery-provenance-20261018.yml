name: V2 recovery provenance and evidence gate
on:
  push:
    branches: [validation-v2-recovery-provenance-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas requests
      - name: Validate real data recovery comparison provenance
        run: |
          python "NextGen Research/tests/run_recovery_snapshot_provenance_tests.py" -v
          python .ci/recommendation_audit/test_actual_snapshot_compare_v2.py -v
          python .ci/recommendation_audit/test_full_universe.py -v
      - name: Verify recovery and integrated router
        run: |
          python "NextGen Research/tests/run_complete_financial_coverage_v2_tests.py"
          python "NextGen Research/tests/run_current_universe_recovery_tests.py"
          python "NextGen Research/tests/run_mixed_event_shadow_tests.py"
          python .ci/native140/test_live_decision_v1.py
          python .ci/recommendation_audit/test_position_metadata_batch.py

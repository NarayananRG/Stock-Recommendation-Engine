name: Build SRE 0.9.7 Legacy Data Autodiscovery

on:
  push:
    branches: [ui-0.9.7-legacy-data-autodiscovery]
    paths:
      - ".ci/native097/**"
      - ".github/workflows/build-native-desktop-096.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sre-native-097
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Decode verified native desktop shell
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".ci\native091\source.part.*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 native shell chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if ($b64.Length -ne 39284) { throw "Native shell base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\native-desktop-shell.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "86dd430e933d044d08ae4637787eff52369b46b7ee1013e48af7851d9ea88fcc") { throw "Native shell hash mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath "." -Force

          Copy-Item ".ci\native097\main_dynamic_port_python.rs" "native-desktop-0.9.1\src-tauri\src\main.rs" -Force
          Copy-Item ".ci\native091\Cargo.toml" "native-desktop-0.9.1\src-tauri\Cargo.toml" -Force

          $main = "native-desktop-0.9.1\src-tauri\src\main.rs"
          $m = Get-Content $main -Raw
          if ($m -notmatch 'choose_free_port') { throw "Dynamic-port launcher missing" }
          if ($m -notmatch 'health_matches') { throw "Backend-version handshake missing" }
          if ($m -match 'const PORT') { throw "Fixed desktop port must not exist in 0.9.7" }
          if ($m -notmatch '0.9.7-installed-app-verified') { throw "Wrong native launcher version" }
          if ($m -notmatch 'STOCK_MODERN_UI_PREVIEW", "0') { throw "Preview must remain disabled" }

          $cargo = "native-desktop-0.9.1\src-tauri\Cargo.toml"
          (Get-Content $cargo -Raw).Replace('version = "0.9.1"','version = "0.9.7"') | Set-Content $cargo -Encoding UTF8

          $pkg = "native-desktop-0.9.1\package.json"
          $j = Get-Content $pkg -Raw | ConvertFrom-Json
          $j.version = "0.9.7"
          $j | ConvertTo-Json -Depth 20 | Set-Content $pkg -Encoding UTF8

      - name: Reconstruct canonical engine and apply 0.9.2 and 0.9.3 overlays
        shell: pwsh
        run: |
          $dir = "stock-engine-ultra-ui-0.8.5-source-with-windows-builder"
          $parts = Get-ChildItem -Path $dir -Filter "source.part.*.b64" | Sort-Object Name
          if (!$parts) { throw "Canonical 0.8.5 source parts missing" }
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = "$env:RUNNER_TEMP\sre085.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "915425e7027fd6145298e3e467b678e6f5998a895d85c4c18a9cfec033df7edc") { throw "Canonical source hash mismatch: $hash" }

          $extract = "$env:RUNNER_TEMP\engine-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $engine = Join-Path $extract "StockRecommendationEngine_0.8.5_ultra_ui_TEST_SOURCE"
          if (!(Test-Path "$engine\requirements-v1.txt")) { throw "Canonical engine root missing" }

          $overlay092Paths = @(
            ".ci\native092\overlay.part.00.b64",
            ".ci\native092\overlay.part.01.b64",
            ".ci\native092\overlay.part.02a.b64",
            ".ci\native092\overlay.part.02b.b64",
            ".ci\native092\overlay.part.03.b64",
            ".ci\native092\overlay.part.04.b64",
            ".ci\native092\overlay.part.05.b64",
            ".ci\native092\overlay.part.06.b64"
          )
          $overlay092B64 = ($overlay092Paths | ForEach-Object { Get-Content $_ -Raw }) -join ""
          if ($overlay092B64.Length -ne 42016) { throw "0.9.2 overlay base64 length mismatch: $($overlay092B64.Length)" }
          $overlay092Zip = "$env:RUNNER_TEMP\sre092-overlay.zip"
          [IO.File]::WriteAllBytes($overlay092Zip, [Convert]::FromBase64String($overlay092B64))
          $overlay092Hash = (Get-FileHash $overlay092Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlay092Hash -ne "ed91eb0ec54c562f2965a730174bbf422c4ae2ba6852f9e046305593cf96d1d8") { throw "0.9.2 overlay hash mismatch: $overlay092Hash" }
          Expand-Archive -LiteralPath $overlay092Zip -DestinationPath $engine -Force

          $overlay093Paths = 0..8 | ForEach-Object { ".ci\native093\overlay.part.{0:D2}.b64" -f $_ }
          $overlay093B64 = ($overlay093Paths | ForEach-Object { Get-Content $_ -Raw }) -join ""
          if ($overlay093B64.Length -ne 46088) { throw "0.9.3 overlay base64 length mismatch: $($overlay093B64.Length)" }
          $overlay093Zip = "$env:RUNNER_TEMP\sre093-overlay.zip"
          [IO.File]::WriteAllBytes($overlay093Zip, [Convert]::FromBase64String($overlay093B64))
          $overlay093Hash = (Get-FileHash $overlay093Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($overlay093Hash -ne "af2e954e71f906ab7331408cac11a78fc97446ca320c6bed7e71eab06b3421c8") { throw "0.9.3 overlay hash mismatch: $overlay093Hash" }
          Expand-Archive -LiteralPath $overlay093Zip -DestinationPath $engine -Force

          if (!(Test-Path "$engine\modern_ui\api.py")) { throw "0.9.3 engine overlay failed" }
          "SRE_ENGINE_ROOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply 0.9.4 fast data-source hotfix
        shell: pwsh
        run: |
          $b64 = ''
          $script = "$env:RUNNER_TEMP\\patch094.py"
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String($b64))
          python $script

      - name: Apply 0.9.7 legacy data autodiscovery
        shell: pwsh
        run: |
          $b64 = Get-Content ".ci\native097\patch097.py.b64" -Raw
          $script = "$env:RUNNER_TEMP\patch097.py"
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String($b64))
          python $script
          $p = "$env:SRE_ENGINE_ROOT\modern_ui\api.py"
          if ((Get-Content $p -Raw) -notmatch 'APP_VERSION = "0.9.7-legacy-data-autodiscovery"') { throw "0.9.7 backend patch failed" }
          if ((Get-Content $p -Raw) -notmatch 'REAL_FROZEN_HISTORY') { throw "Legacy data mode patch missing" }

      - name: Fast repository scan regression
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          $env:SRE094_LARGE_ROOT = "$env:RUNNER_TEMP\\large-real-repo"
          $b64 = ''
          $script = "$env:RUNNER_TEMP\\reg094.py"
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String($b64))
          python $script

      - name: Build deterministic legacy frozen-data fixture
        shell: pwsh
        run: |
          $fixture = "$env:RUNNER_TEMP\sre097-legacy-repo"
          $cache = Join-Path $fixture "stage2_2_1\data\frozen"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:SRE097_FIXTURE_ROOT = $fixture
          @'
          from pathlib import Path
          import csv, datetime, math, os

          root = Path(os.environ["SRE097_FIXTURE_ROOT"])
          cache = root / "stage2_2_1" / "data" / "frozen"
          symbols = ["INFY", "TCS", "RELIANCE", "HDFCBANK", "SUNPHARMA", "LT"]
          start = datetime.date(2023, 1, 2)

          for si, symbol in enumerate(symbols):
              d = start
              price = 900.0 + si * 220.0
              rows = []
              i = 0
              while len(rows) < 760:
                  if d.weekday() < 5:
                      seasonal = math.sin(i / 13 + si) * 0.012 + math.cos(i / 31 + si) * 0.007
                      drift = 0.00035 + (si - 2) * 0.00003
                      close = price * (1 + drift + seasonal * 0.08)
                      op = price * (1 + math.sin(i / 7 + si) * 0.002)
                      hi = max(op, close) * (1.006 + abs(math.sin(i / 9)) * 0.004)
                      lo = min(op, close) * (1 - 0.006 - abs(math.cos(i / 11)) * 0.004)
                      vol = 1_000_000 + si * 120_000 + (i % 37) * 9_000
                      rows.append([d.isoformat(), f"{op:.2f}", f"{hi:.2f}", f"{lo:.2f}", f"{close:.2f}", str(vol)])
                      price = close
                      i += 1
                  d += datetime.timedelta(days=1)
              with (cache / f"{symbol}.NS.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.writer(handle)
                  writer.writerow(["Date", "Open", "High", "Low", "Close", "Volume"])
                  writer.writerows(rows)
          '@ | python -
          "SRE097_FIXTURE_ROOT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test legacy-data recommendations, budget and chart contracts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0
          $engine = "$env:SRE_ENGINE_ROOT"
          $data = "$env:RUNNER_TEMP\sre097-appdata"
          $env:STOCK_MODERN_UI_PREVIEW = "0"
          $env:STOCK_REAL_DATA_REPO_ROOT = "$env:SRE097_FIXTURE_ROOT"

          $p = Start-Process -FilePath python -ArgumentList "`"$engine\run_modern_ui.py`" --no-browser --host 127.0.0.1 --port 18765 --repo-root `"$engine`" --app-data-dir `"$data`"" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 400
              if ($p.HasExited) { throw "0.9.7 backend exited early with code $($p.ExitCode)" }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "0.9.7 backend health check timed out" }
            if ($health.app_version -ne "0.9.7-installed-app-verified") { throw "Wrong app version: $($health.app_version)" }
            if ($health.preview_mode) { throw "Preview mode must be disabled in 0.9.3" }
            if ($health.data_source.mode -ne "REAL_FROZEN_HISTORY") { throw "Legacy real data mode not active: $($health.data_source.mode)" }
            if ([int]$health.data_source.active.stock_files -lt 6) { throw "Real data source did not expose expected stock files" }

            $stock = Invoke-RestMethod "http://127.0.0.1:18765/api/stocks/INFY?limit=5000" -TimeoutSec 15
            if ($stock.bars.Count -lt 700) { throw "Legacy stock chart dataset smoke failed: $($stock.bars.Count)" }

            $runBody = @{capital=50000; horizon_sessions=20; target_return_percent=3} | ConvertTo-Json
            $run = Invoke-RestMethod "http://127.0.0.1:18765/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if ([int]$run.count -lt 1) { throw "Legacy-data opportunity run produced no candidates" }

            $planBody = @{deployable_capital=50000; horizon_sessions=20; target_return_percent=3} | ConvertTo-Json
            $plan = Invoke-RestMethod "http://127.0.0.1:18765/api/capital-plan" -Method Post -ContentType "application/json" -Body $planBody -TimeoutSec 60
            if ([double]$plan.capital_summary.deployable_capital -ne 50000) { throw "Budget was not preserved in capital plan" }
            if (!$plan.source_run.market_session) { throw "Capital plan has no real market session" }

            $source = Invoke-RestMethod "http://127.0.0.1:18765/api/data-source" -TimeoutSec 10
            if ($source.mode -ne "REAL_FROZEN_HISTORY") { throw "Legacy data source endpoint not active" }
            if (!$source.budget_uses_real_data) { throw "Budget is not marked as real-data driven" }
            if ($source.active.provenance -ne "LEGACY_FROZEN_OHLCV") { throw "Legacy provenance missing: $($source.active.provenance)" }

            $js = (Invoke-WebRequest "http://127.0.0.1:18765/assets/app.js" -TimeoutSec 10).Content
            $html = (Invoke-WebRequest "http://127.0.0.1:18765/" -TimeoutSec 10).Content
            if ($js -notmatch 'minBars\s*=\s*8') { throw "8-candle minimum zoom contract missing" }
            if ($js -notmatch 'limit=5000') { throw "5000-session chart history contract missing" }
            if ($html -notmatch 'chartZoomIn' -or $html -notmatch 'chartZoomOut') { throw "Chart zoom buttons missing" }
            if ($html -notmatch 'drag to pan') { throw "Chart pan guidance missing" }
            if ($js -notmatch 'REAL FROZEN DATA') { throw "Legacy data UI badge contract missing" }

            Write-Host "0.9.7 LEGACY BACKEND CONTRACT PASS"
            Write-Host "Budget: $($plan.capital_summary.deployable_capital)"
            Write-Host "Market session: $($plan.source_run.market_session)"
            Write-Host "Chart bars: $($stock.bars.Count)"
            Write-Host "Candidates: $($run.count)"
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Package native application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "native-desktop-0.9.1\resources" | Out-Null
          Compress-Archive -Path "$env:SRE_ENGINE_ROOT\*" -DestinationPath "native-desktop-0.9.1\resources\SRE097_ENGINE_SOURCE.zip" -Force

          New-Item -ItemType Directory -Force -Path "native-desktop-0.9.1\src-tauri\icons" | Out-Null
          python -c "import struct,pathlib; w=h=32; px=bytes([52,211,153,255])*(w*h); mask=bytes(128); dib=struct.pack('<IIIHHIIIIII',40,w,h*2,1,32,0,len(px),0,0,0,0)+px+mask; ico=struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',w,h,0,0,1,32,len(dib),22)+dib; pathlib.Path(r'native-desktop-0.9.1\src-tauri\icons\icon.ico').write_bytes(ico)"

          $p = "native-desktop-0.9.1\src-tauri\tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.version = "0.9.7"
          $c.productName = "Stock Recommendation Engine"
          $c.bundle.targets = @("nsis")
          $c.bundle.resources = @{"../resources/SRE097_ENGINE_SOURCE.zip"="resources/SRE097_ENGINE_SOURCE.zip"}
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding UTF8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-desktop-0.9.1/src-tauri

      - name: Install Tauri CLI
        working-directory: native-desktop-0.9.1
        run: npm install --no-audit --no-fund

      - name: Build native Windows installer
        working-directory: native-desktop-0.9.1
        run: npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "0.9.7 native Setup.exe missing" }
          Write-Host "SETUP: $($setup.FullName)"
          Write-Host "SIZE: $($setup.Length)"
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Install and launch generated Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem "native-desktop-0.9.1\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$setup) { throw "Generated installer missing before installed-app test" }

          $installDir = "$env:RUNNER_TEMP\SRE097Installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Write-Host "Silent installing: $($setup.FullName)"
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Silent installer failed: $($installer.ExitCode)" }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Stock Recommendation Engine" } |
            Select-Object -First 1

          $candidateDirs = @($installDir)
          if ($entry) {
            Write-Host "Registry install entry found:"
            $entry | Select-Object DisplayName,DisplayVersion,InstallLocation,UninstallString | Format-List
            if ($entry.InstallLocation) { $candidateDirs += $entry.InstallLocation }
            if ($entry.UninstallString) {
              $un = [Environment]::ExpandEnvironmentVariables($entry.UninstallString.Trim('"'))
              if (Test-Path $un) { $candidateDirs += (Split-Path $un -Parent) }
            }
          }

          $appExe = $null
          foreach ($dir in ($candidateDirs | Where-Object { $_ } | Select-Object -Unique)) {
            if (!(Test-Path $dir)) { continue }
            Write-Host "Inspecting install directory: $dir"
            Get-ChildItem $dir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  EXE: $($_.FullName)" }
            $appExe = Get-ChildItem $dir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch "uninstall|unins|setup|updater" -and
                ($_.Name -match "stock|recommendation|engine|sre" -or $_.Length -gt 1000000)
              } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if ($appExe) { break }
          }

          if (!$appExe) {
            $recent = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-10) -and $_.Name -notmatch "uninstall|unins|setup|updater" } |
              Sort-Object Length -Descending
            $recent | Select-Object -First 20 | ForEach-Object { Write-Host "Recent EXE: $($_.FullName)" }
            $appExe = $recent | Where-Object { $_.Name -match "stock|recommendation|engine|sre" } | Select-Object -First 1
          }

          if (!$appExe) { throw "Installed desktop EXE was not found after Setup.exe completed" }
          Write-Host "Installed EXE: $($appExe.FullName)"

          $appData = Join-Path $env:LOCALAPPDATA "StockRecommendationEngine"
          $ready = Join-Path $appData "runtime-ready.txt"
          $portFile = Join-Path $appData "runtime-port.txt"
          $logFile = Join-Path $appData "native-desktop-0.9.7.log"
          Remove-Item $ready,$portFile -Force -ErrorAction SilentlyContinue

          $env:STOCK_REAL_DATA_REPO_ROOT = "$env:SRE097_FIXTURE_ROOT"
          $desktop = Start-Process -FilePath $appExe.FullName -PassThru
          try {
            $alive = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if ($desktop.HasExited) {
                if (Test-Path $logFile) {
                  Write-Host "---- startup log ----"
                  Get-Content $logFile -Tail 200
                }
                throw "Installed desktop app exited during startup with code $($desktop.ExitCode)"
              }
              if (Test-Path $ready) { $alive = $true; break }
            }
            if (!$alive) {
              if (Test-Path $logFile) {
                Write-Host "---- startup log ----"
                Get-Content $logFile -Tail 200
              }
              throw "Installed desktop app never reached runtime-ready state"
            }

            $readyLines = Get-Content $ready
            if ($readyLines[0] -ne "0.9.7-installed-app-verified") {
              throw "Installed desktop runtime version mismatch: $($readyLines[0])"
            }
            $port = [int]$readyLines[1]
            if ($port -le 0) { throw "Installed desktop runtime port invalid" }
            Write-Host "Installed app dynamic port: $port"

            $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 10
            if ($health.status -ne "ok") { throw "Installed app health status is not ok" }
            if ($health.app_version -ne "0.9.7-installed-app-verified") {
              throw "Installed app backend version mismatch: $($health.app_version)"
            }

            $source = Invoke-RestMethod "http://127.0.0.1:$port/api/data-source" -TimeoutSec 10
            if ($source.mode -ne "REAL_FROZEN_HISTORY") {
              throw "Installed app did not connect to real fixture data: $($source.mode)"
            }
            if ([int]$source.active.stock_files -lt 6) {
              throw "Installed app real-data stock count too small: $($source.active.stock_files)"
            }
            if ($source.active.provenance -ne "LEGACY_FROZEN_OHLCV") {
              throw "Installed app legacy provenance mismatch: $($source.active.provenance)"
            }

            $body = @{path="$env:SRE097_FIXTURE_ROOT"} | ConvertTo-Json
            $connected = Invoke-RestMethod "http://127.0.0.1:$port/api/data-source" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 15
            if ($connected.mode -ne "REAL_FROZEN_HISTORY") {
              throw "Installed app POST /api/data-source failed"
            }

            $runBody = @{capital=50000; horizon_sessions=20; target_return_percent=3} | ConvertTo-Json
            $run = Invoke-RestMethod "http://127.0.0.1:$port/api/opportunities/run" -Method Post -ContentType "application/json" -Body $runBody -TimeoutSec 60
            if ([int]$run.count -lt 1) { throw "Installed app legacy recommendation calculation returned zero candidates" }

            $planBody = @{deployable_capital=50000; horizon_sessions=20; target_return_percent=3} | ConvertTo-Json
            $plan = Invoke-RestMethod "http://127.0.0.1:$port/api/capital-plan" -Method Post -ContentType "application/json" -Body $planBody -TimeoutSec 60
            if ([double]$plan.capital_summary.deployable_capital -ne 50000) { throw "Installed app legacy Capital Plan lost the ₹50,000 budget" }

            $root = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 10
            if ($root.StatusCode -ne 200) { throw "Installed app UI root did not return HTTP 200" }
            if ($root.Content -notmatch "Stock Recommendation Engine") {
              throw "Installed app UI root is not the expected workspace"
            }

            Write-Host "INSTALLED APP END-TO-END PASS"
            Write-Host "Version: $($health.app_version)"
            Write-Host "Mode: $($source.mode)"
            Write-Host "Stocks: $($source.active.stock_files)"
            Write-Host "Port: $port"
          }
          finally {
            if (!$desktop.HasExited) {
              Start-Process -FilePath "taskkill.exe" -ArgumentList @("/PID",$desktop.Id,"/T","/F") -Wait -NoNewWindow | Out-Null
            }
          }

      - name: Upload 0.9.7 installer
        uses: actions/upload-artifact@v4
        with:
          name: SRE-0.9.7-Installed-App-Verified-Setup
          path: native-desktop-0.9.1/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
# trigger: installed legacy-data test

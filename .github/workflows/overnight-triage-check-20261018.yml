name: Validate overnight failure triage
on:
  push:
    branches: [automation-overnight-validation-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triage-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pandas requests
      - name: Execute full overnight audits and validate diagnostics
        run: python .ci/overnight/overnight_validation.py
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-triage-${{ github.run_id }}
          path: audit-output/
          retention-days: 7
